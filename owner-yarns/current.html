<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Knit Compass — 糸検索</title>
  <style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#f2f5f3}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="ownerFrame" src="./index.html" title="Knit Compass 糸検索"></iframe>
<script>
(()=>{
  'use strict';
  if(location.hash==='#intake'){location.replace('./intake-current.html');return}
  const frame=document.getElementById('ownerFrame');
  function patch(){
    try{
      const doc=frame.contentDocument;if(!doc)return;
      const glossary=[...doc.querySelectorAll('a')].find(a=>a.getAttribute('href')?.includes('cn-yarn-glossary'));if(glossary)glossary.textContent='中国糸名・素材名辞典';
      const stats=[...doc.querySelectorAll('.hero-stats div')];
      const human=stats.find(node=>node.querySelector('span')?.textContent?.includes('Human Review候補'));if(human?.querySelector('strong'))human.querySelector('strong').textContent='25件';
      const intakeTab=[...doc.querySelectorAll('[data-tab]')].find(node=>node.dataset.tab==='intake');
      if(intakeTab){intakeTab.textContent='未反映25件・Human Review';intakeTab.addEventListener('click',event=>{event.preventDefault();event.stopImmediatePropagation();location.href='./intake-current.html'},{capture:true})}
      const legacyImport=doc.getElementById('importAll');if(legacyImport){legacyImport.textContent='25件の現行取込を開く';legacyImport.addEventListener('click',event=>{event.preventDefault();event.stopImmediatePropagation();location.href='./intake-current.html'},{capture:true})}
      const intakeHeading=[...doc.querySelectorAll('[data-panel="intake"] .section-head p')][0];if(intakeHeading)intakeHeading.textContent='現行取込は10バッチ・合計25件（Winning Textile Levita含む）です。';
    }catch(error){console.warn('owner-yarns current wrapper patch skipped',error)}
  }
  frame.addEventListener('load',patch);
})();
</script>
</body>
</html>
