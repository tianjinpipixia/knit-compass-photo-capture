<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#163f3c">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; img-src 'self' blob: data:; style-src 'self'; script-src 'self' 'unsafe-inline'; worker-src 'none'; connect-src 'none'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Knit Compass Photo Capture Direct</title>
  <link rel="icon" href="brand/knit-compass-mark.png?v=1.0.0" type="image/png">
  <link rel="stylesheet" href="app.css?v=2.1.44-independent.1">
  <link rel="stylesheet" href="knit-compass-ui.css?v=2.1.44-independent.1">
  <link rel="stylesheet" href="connection-status.css?v=1.0.0">
  <link rel="stylesheet" href="capture/exhibition-burst-mode.css?v=2.1.44-independent.3">
  <link rel="stylesheet" href="capture/mobile-compact-20260827.css?v=1">
</head>
<body data-surface="mobile">
  <aside class="connection-strip" aria-label="Photo Capture Direct">
    <strong>Photo Capture</strong>
  </aside>
  <div id="app" aria-live="polite"></div>
  <noscript>この画面を使用するにはJavaScriptを有効にしてください。</noscript>
  <script>
    (() => {
      'use strict';
      const DB_NAME = 'kc_independent_photo_capture_v1_0';
      const SESSION_KEY = 'kc_session_v1';
      const AUTH_REALM = 'KNIT_COMPASS_DEVICE_LOCAL';
      const app = document.getElementById('app');

      function show(message) {
        if (!app) return;
        app.innerHTML = `<main class="kc-app kc-auth-wrap"><section class="kc-auth-card"><p class="kc-eyebrow">Photo Capture Direct</p><h1>Knit Compass Photo Capture</h1><p class="kc-message" role="status">${message}</p></section></main>`;
      }

      function openDb() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME);
          request.addEventListener('success', () => resolve(request.result), { once: true });
          request.addEventListener('error', () => reject(request.error || new Error('端末内データベースを開けません')), { once: true });
          request.addEventListener('blocked', () => reject(new Error('別のPhoto Capture画面を完全に閉じてください')), { once: true });
        });
      }

      function getAll(store) {
        return new Promise((resolve, reject) => {
          const request = store.getAll();
          request.addEventListener('success', () => resolve(Array.isArray(request.result) ? request.result : []), { once: true });
          request.addEventListener('error', () => reject(request.error || new Error('保存済み利用者を確認できません')), { once: true });
        });
      }

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src;
          script.defer = true;
          script.addEventListener('load', resolve, { once: true });
          script.addEventListener('error', () => reject(new Error(`読み込み失敗: ${src}`)), { once: true });
          document.body.appendChild(script);
        });
      }

      async function boot() {
        show('この端末の72件の保存データを直接起動しています…');
        let db;
        try {
          db = await openDb();
          if (!db.objectStoreNames.contains('accounts')) throw new Error('保存済み利用者が見つかりません');
          const tx = db.transaction('accounts', 'readonly');
          const accounts = await getAll(tx.objectStore('accounts'));
          if (accounts.length !== 1 || !accounts[0]?.accountId) {
            throw new Error(accounts.length > 1 ? '利用者が複数あるため直接起動できません' : '保存済み利用者が見つかりません');
          }
          const account = accounts[0];
          sessionStorage.setItem(SESSION_KEY, JSON.stringify({
            accountId: account.accountId,
            displayName: account.displayName || 'Knit Compass Owner',
            realm: AUTH_REALM
          }));
        } catch (error) {
          show(`直接起動の準備に失敗しました: ${error.message || error}`);
          return;
        } finally {
          try { db?.close(); } catch (_error) {}
        }

        try {
          await loadScript(`exhibition-supplier-master.js?v=2.1.44-independent.1&direct=116`);
          await loadScript(`app.js?v=2.1.44-independent.1&direct=116`);
          await loadScript(`capture/auth-legacy-compat-20260827.js?v=3-direct-116`);
          await loadScript(`backup.js?v=1.1.0-operational-hardening-4&direct=116`);
          await loadScript(`capture/layout-priority.js?v=1.2.0-compact-summary&direct=116`);
          await loadScript(`capture/exhibition-burst-mode.js?v=2.1.44-independent.1&direct=116`);
          await loadScript(`capture/mobile-compact-20260827.js?v=1&direct=116`);
          await loadScript(`usage-metrics.js?v=1.0.1-yarn-taxonomy&direct=116`);
          await loadScript(`yarn-taxonomy-guard.js?v=1.0.0&direct=116`);
        } catch (error) {
          show(`Photo Capture本体を読み込めませんでした: ${error.message || error}`);
        }
      }

      boot();
    })();
  </script>
</body>
</html>
