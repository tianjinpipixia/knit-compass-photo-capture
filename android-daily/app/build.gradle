plugins {
    id 'com.android.application'
}

def bundledAppHtml = layout.projectDirectory.file('../../brand-intelligence/app.html')
def generatedAppAssets = layout.buildDirectory.dir('generated/app-assets')

def bundleAppHtml = tasks.register('bundleAppHtml', Sync) {
    from bundledAppHtml
    into generatedAppAssets

    doFirst {
        if (!bundledAppHtml.asFile.isFile()) {
            throw new GradleException("Missing bundled app source: ${bundledAppHtml.asFile}")
        }
    }
}

android {
    namespace 'com.knitcompass.daily'
    compileSdk 35

    defaultConfig {
        applicationId 'com.knitcompass.daily'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.4.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDir generatedAppAssets
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn bundleAppHtml
}
