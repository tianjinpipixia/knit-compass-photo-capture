<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#163f3c">
  <meta name="application-name" content="Knit Compass">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Knit Compass">
  <title>Knit Compass v0.4</title>
  <link rel="manifest" href="./manifest.webmanifest?v=0.4.6">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <style>
    :root{--ink:#172826;--paper:#f2f5f3;--teal:#163f3c;--muted:#cbdad5;--line:rgba(255,255,255,.28)}
    *{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--paper);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
    button,a{font:inherit}.shell{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
    .switcher{background:var(--ink);color:#fff;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;padding:7px 10px calc(7px + env(safe-area-inset-top));z-index:100}
    .brand{display:flex;align-items:center;gap:8px;min-width:max-content}.mark{display:grid;place-items:center;width:31px;height:31px;border-radius:9px;background:#fff;color:var(--teal);font-size:11px;font-weight:950}.brand strong{display:block;font-size:12px}.brand span{display:block;color:var(--muted);font-size:8px}
    .site-nav{display:flex;align-items:center;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;padding-bottom:1px}.nav-item{display:inline-flex;align-items:center;justify-content:center;min-height:36px;border:1px solid var(--line);border-radius:9px;background:transparent;color:#fff;text-decoration:none;padding:7px 10px;font-size:10px;font-weight:900;white-space:nowrap;cursor:pointer}.nav-item.active{background:#fff;color:var(--teal)}.nav-item:hover{background:rgba(255,255,255,.12)}.nav-item.active:hover{background:#fff}
    .frame-wrap{min-height:0}.frame{display:block;width:100%;height:100%;border:0;background:var(--paper)}
    @media(max-width:760px){.switcher{grid-template-columns:1fr;gap:6px;padding-left:7px;padding-right:7px}.brand span{display:none}.brand strong{font-size:11px}.site-nav{width:100%}.nav-item{padding:7px 9px;font-size:9px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="switcher">
      <div class="brand"><div class="mark">KC</div><div><strong>Knit Compass v0.4</strong><span>全機能への共通入口</span></div></div>
      <nav class="site-nav" aria-label="Knit Compass主要サイト">
        <button class="nav-item active" id="tabV04" type="button">V04本体</button>
        <a class="nav-item" href="../" target="_top">Photo Capture</a>
        <button class="nav-item" id="tabGlossary" type="button">中国糸名辞書</button>
        <a class="nav-item" href="../daily/" target="_top">Daily</a>
        <a class="nav-item" href="../customer-sharing/" target="_top">共有管理</a>
        <a class="nav-item" href="../stylem/" target="_top">STYLEM</a>
        <a class="nav-item" href="../status/" target="_top">システム状態</a>
      </nav>
    </header>
    <main class="frame-wrap"><iframe class="frame" id="contentFrame" title="Knit Compass v0.4" src="./index-current.html"></iframe></main>
  </div>
<script>
(()=>{
  'use strict';
  const frame=document.getElementById('contentFrame');
  const tabV04=document.getElementById('tabV04');
  const tabGlossary=document.getElementById('tabGlossary');
  const ROUTES={v04:'./index-current.html',glossary:'./yarn-glossary.html'};
  function openRoute(name,replaceHash=false){
    const glossary=name==='glossary';
    frame.src=glossary?ROUTES.glossary:ROUTES.v04;
    tabGlossary.classList.toggle('active',glossary);
    tabV04.classList.toggle('active',!glossary);
    const hash=glossary?'#cn-yarn-glossary':'#v04';
    if(location.hash!==hash){if(replaceHash)history.replaceState(null,'',hash);else history.pushState(null,'',hash)}
  }
  tabV04.addEventListener('click',()=>openRoute('v04'));
  tabGlossary.addEventListener('click',()=>openRoute('glossary'));
  window.addEventListener('popstate',()=>openRoute(location.hash==='#cn-yarn-glossary'?'glossary':'v04',true));
  openRoute(location.hash==='#cn-yarn-glossary'?'glossary':'v04',true);
})();
</script>
</body>
</html>
