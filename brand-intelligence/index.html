<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#163f3c">
  <meta name="application-name" content="Knit Compass">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Knit Compass">
  <title>Knit Compass — 商品調査・Human Review</title>
  <link rel="manifest" href="./manifest.webmanifest?v=0.4.8">
  <link rel="icon" href="../brand/knit-compass-mark.png" type="image/png">
  <link rel="apple-touch-icon" href="../brand/knit-compass-mark.png">
  <style>
    :root{--ink:#172826;--paper:#f2f5f3;--teal:#163f3c;--muted:#cbdad5;--line:rgba(255,255,255,.28);--menu-line:#d6dfdb}
    *{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--paper);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
    button,a{font:inherit}.shell{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
    .switcher{position:relative;background:var(--ink);color:#fff;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:14px;padding:7px 10px calc(7px + env(safe-area-inset-top));z-index:100}
    .brand{display:flex;align-items:center;gap:8px;min-width:max-content}.mark{display:block;width:31px;height:31px;border-radius:9px;background:#fff;object-fit:contain;padding:1px}.brand strong{display:block;font-size:12px}.brand span{display:block;color:var(--muted);font-size:8px}
    .primary-nav{display:flex;align-items:center;justify-content:flex-end;gap:6px;min-width:0}.nav-item{display:inline-flex;align-items:center;justify-content:center;min-height:36px;border:1px solid var(--line);border-radius:9px;background:transparent;color:#fff;text-decoration:none;padding:7px 11px;font-size:10px;font-weight:900;white-space:nowrap;cursor:pointer}.nav-item.active{background:#fff;color:var(--teal)}.nav-item:hover{background:rgba(255,255,255,.12)}.nav-item.active:hover{background:#fff}
    .manage{position:relative}.manage-button::after{content:"⌄";margin-left:5px;font-size:10px}.manage-button[aria-expanded="true"]{background:rgba(255,255,255,.14)}
    .manage-menu{position:absolute;top:calc(100% + 8px);right:0;width:250px;display:none;padding:7px;background:#fff;border:1px solid var(--menu-line);border-radius:12px;box-shadow:0 14px 36px rgba(10,24,22,.24);z-index:120}.manage-menu.open{display:grid;gap:4px}.manage-link{display:grid;gap:1px;padding:10px 11px;border-radius:9px;color:var(--ink);text-decoration:none}.manage-link:hover{background:#eef3f1}.manage-link strong{font-size:11px}.manage-link span{font-size:9px;color:#5d6d69}
    .frame-wrap{min-height:0}.frame{display:block;width:100%;height:100%;border:0;background:var(--paper)}
    @media(max-width:760px){.switcher{grid-template-columns:1fr;gap:6px;padding-left:7px;padding-right:7px}.brand span{display:none}.brand strong{font-size:11px}.primary-nav{justify-content:flex-start;overflow-x:auto;overscroll-behavior-inline:contain;scrollbar-width:none;width:100%;padding-bottom:2px}.primary-nav::-webkit-scrollbar{display:none}.nav-item{min-width:max-content;padding:7px 10px;font-size:9px}.manage{min-width:max-content}.manage-menu{position:fixed;top:calc(82px + env(safe-area-inset-top));right:7px;width:min(300px,calc(100vw - 14px))}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="switcher">
      <div class="brand"><img class="mark" src="../brand/knit-compass-mark.png" alt="Knit Compass公式ロゴ"><div><strong>Knit Compass</strong><span>確認後に正式登録・外部へ自動送信しません</span></div></div>
      <nav class="primary-nav" aria-label="Knit Compass主要操作">
        <button class="nav-item active" id="tabV04" type="button">商品調査</button>
        <a class="nav-item" href="../owner-yarns/" target="_top">糸検索</a>
        <a class="nav-item" href="../market-intelligence/" target="_top">原料相場</a>
        <a class="nav-item" href="../knit-image/" target="_top">編み地イメージ</a>
        <a class="nav-item" href="../fabric-inspection/" target="_top">生地検査</a>
        <a class="nav-item" href="../" target="_top" title="Photo Captureを開く">Photo Capture</a>
        <button class="nav-item" id="tabGlossary" type="button">中国糸名・素材名辞典</button>
        <a class="nav-item" href="../daily/" target="_top">Daily</a>
        <div class="manage" id="manageArea">
          <button class="nav-item manage-button" id="manageButton" type="button" aria-haspopup="true" aria-expanded="false">管理</button>
          <div class="manage-menu" id="manageMenu" role="menu" aria-label="管理メニュー">
            <a class="manage-link" href="./index-current.html" target="_top" role="menuitem"><strong>Human Review</strong><span>承認・条件付き・HOLDを確認</span></a>
            <a class="manage-link" href="../owner-yarns/intake-current.html" target="_top" role="menuitem"><strong>未反映候補の取込</strong><span>25件（Winning Textile Levita含む）をPENDING追加</span></a>
            <a class="manage-link" href="./v04-reflection-status.html" target="_top" role="menuitem"><strong>V04反映確認</strong><span>辞典・Levita・Tier-A 11・最新MDの接続を監査</span></a>
            <a class="manage-link" href="../customer-sharing/" target="_top" role="menuitem"><strong>共有管理</strong><span>顧客へ共有する内容を管理</span></a>
            <a class="manage-link" href="../stylem/" target="_top" role="menuitem"><strong>顧客ポータル</strong><span>承認済みの顧客表示を確認</span></a>
            <a class="manage-link" href="../status/" target="_top" role="menuitem"><strong>システム状態</strong><span>接続・保存先・Revisionを確認</span></a>
          </div>
        </div>
      </nav>
    </header>
    <main class="frame-wrap"><iframe class="frame" id="contentFrame" title="Knit Compass 商品調査・Human Review" src="./index-current.html"></iframe></main>
  </div>
<script>
(()=>{
  'use strict';
  const frame=document.getElementById('contentFrame');
  const tabV04=document.getElementById('tabV04');
  const tabGlossary=document.getElementById('tabGlossary');
  const manageArea=document.getElementById('manageArea');
  const manageButton=document.getElementById('manageButton');
  const manageMenu=document.getElementById('manageMenu');
  const ROUTES={v04:'./index-current.html',glossary:'./yarn-glossary.html'};

  function setManage(open){manageMenu.classList.toggle('open',open);manageButton.setAttribute('aria-expanded',String(open))}
  manageButton.addEventListener('click',event=>{event.stopPropagation();setManage(manageButton.getAttribute('aria-expanded')!=='true')});
  document.addEventListener('click',event=>{if(!manageArea.contains(event.target))setManage(false)});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'){setManage(false);manageButton.focus()}});

  function openRoute(name,replaceHash=false){
    const glossary=name==='glossary';
    frame.src=glossary?ROUTES.glossary:ROUTES.v04;
    tabGlossary.classList.toggle('active',glossary);
    tabV04.classList.toggle('active',!glossary);
    setManage(false);
    const hash=glossary?'#cn-yarn-glossary':'#v04';
    if(location.hash!==hash){if(replaceHash)history.replaceState(null,'',hash);else history.pushState(null,'',hash)}
  }
  tabV04.addEventListener('click',()=>openRoute('v04'));
  tabGlossary.addEventListener('click',()=>openRoute('glossary'));
  window.addEventListener('popstate',()=>openRoute(location.hash==='#cn-yarn-glossary'?'glossary':'v04',true));
  openRoute(location.hash==='#cn-yarn-glossary'?'glossary':'v04',true);
})();
</script>
<script src="../market-signals.js?v=1.0.2"></script>
<script src="./siro-glossary-augment.js?v=1.0.0"></script>
<script src="./owner-observed-products.js?v=0.4.8"></script>
</body>
</html>
