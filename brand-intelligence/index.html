<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#163f3c">
  <meta name="application-name" content="Knit Compass">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Knit Compass">
  <title>Knit Compass v0.4 — Photo Capture受信箱</title>
  <link rel="manifest" href="./manifest.webmanifest?v=0.4.4">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <style>
    :root{--ink:#172826;--muted:#5d6d69;--paper:#f2f5f3;--card:#fff;--teal:#163f3c;--teal2:#235c56;--line:#d6dfdb;--soft:#eef3f1;--amber:#9a6a20;--amber-bg:#fff5df;--red:#8a342e;--red-bg:#fff0ed;--green:#2f6a37;--green-bg:#e9f5e7;--shadow:0 12px 36px rgba(23,40,38,.16)}
    *{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}button,input,select{font:inherit}button{cursor:pointer}
    .shell{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}.bar{min-height:58px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px calc(8px + env(safe-area-inset-top));z-index:20}.brand{display:flex;align-items:center;gap:10px;min-width:0}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:#fff;color:var(--teal);font-weight:950}.brand strong{display:block;font-size:14px}.brand span{display:block;color:#cbdad5;font-size:9px}.inbox-button{display:inline-flex;align-items:center;gap:8px;min-height:42px;border:1px solid rgba(255,255,255,.34);border-radius:11px;background:#fff;color:var(--teal);padding:8px 12px;font-size:11px;font-weight:900}.count{display:grid;place-items:center;min-width:23px;height:23px;border-radius:999px;background:var(--amber-bg);color:var(--amber);font-size:10px}.frame-wrap{min-height:0}.frame-wrap iframe{display:block;width:100%;height:100%;border:0;background:var(--paper)}
    .overlay{position:fixed;inset:0;background:rgba(10,24,22,.55);opacity:0;pointer-events:none;transition:.18s;z-index:50}.overlay.open{opacity:1;pointer-events:auto}.drawer{position:fixed;top:0;right:0;z-index:60;width:min(520px,100%);height:100%;background:var(--paper);box-shadow:var(--shadow);transform:translateX(102%);transition:.22s;display:grid;grid-template-rows:auto auto minmax(0,1fr)}.drawer.open{transform:translateX(0)}.drawer-head{background:var(--teal);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 15px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.drawer-head h1{margin:2px 0 4px;font-size:22px}.drawer-head p{margin:0;color:#dbe8e3;font-size:11px}.close{border:1px solid rgba(255,255,255,.35);border-radius:9px;background:transparent;color:#fff;padding:8px 10px;font-weight:900}.controls{padding:12px 14px;background:#fff;border-bottom:1px solid var(--line);display:grid;gap:10px}.control-grid{display:grid;grid-template-columns:1fr auto;gap:8px}.field{display:grid;gap:5px}.field label{color:var(--muted);font-size:10px;font-weight:850}.field input,.field select{width:100%;min-height:40px;border:1px solid #bdcbc5;border-radius:9px;background:#fff;padding:8px 10px}.btn{min-height:40px;border:1px solid var(--teal);border-radius:9px;background:var(--teal);color:#fff;padding:8px 11px;font-size:11px;font-weight:900}.btn.secondary{background:#fff;color:var(--teal);border-color:#aabcb5}.btn.danger{background:#fff;color:var(--red);border-color:#d9b2aa}.file{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:8px}.stat span{display:block;color:var(--muted);font-size:9px}.stat strong{font-size:18px}.message{min-height:18px;color:var(--muted);font-size:10px}.message.error{color:var(--red)}
    .list{overflow:auto;padding:12px 14px calc(28px + env(safe-area-inset-bottom));display:grid;align-content:start;gap:10px}.empty{border:1px dashed #aebdb7;border-radius:13px;background:#fff;padding:24px;text-align:center;color:var(--muted);font-size:12px}.item{border:1px solid var(--line);border-radius:13px;background:#fff;padding:12px;display:grid;gap:10px}.item.approved{border-color:#a6c7ad;background:#fbfefb}.item.rejected{border-color:#d8b2aa;background:#fffafa}.item-head{display:flex;justify-content:space-between;gap:10px}.item h2{margin:0;font-size:14px}.meta{color:var(--muted);font-size:9px;overflow-wrap:anywhere}.status{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:9px;font-weight:900}.status.PENDING{background:var(--amber-bg);color:var(--amber)}.status.APPROVED{background:var(--green-bg);color:var(--green)}.status.REJECTED{background:var(--red-bg);color:var(--red)}.summary{display:grid;gap:5px;font-size:10px}.summary strong{color:var(--teal)}.review-grid{display:grid;grid-template-columns:140px 1fr;gap:7px}.item-actions{display:flex;gap:7px;flex-wrap:wrap}.details{border-top:1px solid var(--line);padding-top:9px;display:none;color:var(--muted);font-size:10px;white-space:pre-wrap}.details.open{display:block}.tag-row{display:flex;gap:5px;flex-wrap:wrap}.tag{border:1px solid #cfddd4;border-radius:999px;background:#edf4ef;padding:3px 7px;color:#31594c;font-size:9px;font-weight:800}
    @media(max-width:600px){.bar{min-height:66px}.brand span{display:none}.inbox-button{padding:8px}.drawer{width:100%}.review-grid,.control-grid{grid-template-columns:1fr}.item-actions .btn{flex:1}.stats{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="bar">
      <div class="brand"><div class="mark">KC</div><div><strong>Knit Compass v0.4</strong><span>Photo Capture受信箱 → Human Review → マスター確定</span></div></div>
      <button class="inbox-button" id="openInbox">Photo Capture受信箱 <span class="count" id="pendingBadge">0</span></button>
    </header>
    <main class="frame-wrap"><iframe id="v04Frame" title="Knit Compass 独立実用版 v0.4" src="./app.html?v=0.4.4"></iframe></main>
  </div>

  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-label="Photo Capture受信箱">
    <div class="drawer-head"><div><div style="font-size:9px;font-weight:900;letter-spacing:.12em">KC-V04-INBOX</div><h1>Human Review</h1><p>承認後だけ商品・糸・会社マスターへ確定反映します。</p></div><button class="close" id="closeInbox">閉じる</button></div>
    <section class="controls">
      <div class="control-grid"><div class="field"><label for="reviewer">確認者</label><input id="reviewer" value="Owner Human Review"></div><button class="btn secondary" id="importButton">受信箱JSONを取込</button></div>
      <input class="file" id="importFile" type="file" accept="application/json,.json">
      <div class="stats"><div class="stat"><span>承認待ち</span><strong id="pendingCount">0</strong></div><div class="stat"><span>承認済み</span><strong id="approvedCount">0</strong></div><div class="stat"><span>却下</span><strong id="rejectedCount">0</strong></div></div>
      <div class="message" id="message">同じブラウザではPhoto Captureから自動で受信します。別サイト・別端末はJSONを取り込みます。</div>
    </section>
    <section class="list" id="inboxList"></section>
  </aside>

  <script>
  (()=>{
    'use strict';
    const HANDOFF_KEY='kc_v04_handoff_queue_v1';
    const V04_KEY='kc_independent_practical_v0_4';
    const REVIEWER_KEY='kc_v04_reviewer_name_v1';
    const QUEUE_LIMIT=500;
    const TYPE_OPTIONS=[['yarn','糸'],['product','商品'],['material','素材・原料'],['organization','会社・組織'],['research','調査記録']];
    const PREFIX={yarn:['YN',8],product:['PR',8],material:['MT',7],organization:['OR',7],research:['RS',10]};
    const WEAK_VALUES=new Set(['','unconfirmed','not_confirmed','candidate','inferred','unknown','Unknown','UNKNOWN']);
    const $=id=>document.getElementById(id);
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#039;'}[c]));
    const now=()=>new Date().toISOString();
    const uuid=()=>crypto.randomUUID?.()||`${Date.now()}-${Math.random().toString(16).slice(2)}`;
    const makeId=prefix=>`${prefix}-${uuid()}`;

    function loadQueue(){try{const value=JSON.parse(localStorage.getItem(HANDOFF_KEY)||'[]');return Array.isArray(value)?value:[]}catch{return[]}}
    function queueKey(item){return item?.dedupe_key||item?.handoff_id||''}
    function compactQueue(queue){
      const ordered=[...queue].sort((a,b)=>String(b.sent_at||'').localeCompare(String(a.sent_at||'')));
      const deduped=[];const seen=new Set();
      for(const item of ordered){const key=queueKey(item);if(key&&seen.has(key))continue;if(key)seen.add(key);deduped.push(item)}
      const pending=deduped.filter(item=>item.review_status==='PENDING');
      const reviewed=deduped.filter(item=>item.review_status!=='PENDING');
      const reviewedSlots=Math.max(0,QUEUE_LIMIT-pending.length);
      return [...pending,...reviewed.slice(0,reviewedSlots)].sort((a,b)=>String(b.sent_at||'').localeCompare(String(a.sent_at||'')));
    }
    function saveQueue(queue){
      const compacted=compactQueue(queue);
      try{localStorage.setItem(HANDOFF_KEY,JSON.stringify(compacted))}
      catch(error){throw new Error(`受信箱を保存できません。未承認データは削除していません: ${error.message||error}`)}
      return{saved:compacted.length,prunedReviewed:Math.max(0,queue.length-compacted.length)};
    }
    function loadState(){try{const value=JSON.parse(localStorage.getItem(V04_KEY)||'null');return value&&typeof value==='object'?value:{}}catch{return{}}}
    function saveState(state){state.updated_at=now();state.server={workspaceId:'personal-owner',apiBase:location.origin,token:'',lastSyncAt:'',lastSyncStatus:'LOCAL_ONLY',syncMode:'LOCAL_ONLY',serverRevision:0,localRevision:0,...(state.server||{})};state.server.localRevision=Number(state.server.localRevision||0)+1;localStorage.setItem(V04_KEY,JSON.stringify(state))}
    function setMessage(text,error=false){$('message').textContent=text;$('message').classList.toggle('error',error)}
    function openDrawer(){render();$('drawer').classList.add('open');$('overlay').classList.add('open')}
    function closeDrawer(){$('drawer').classList.remove('open');$('overlay').classList.remove('open')}

    function hasMeaningfulValue(value){
      if(value===null||value===undefined)return false;
      if(typeof value==='string')return value.trim()!=='';
      if(Array.isArray(value))return value.length>0;
      if(typeof value==='object')return Object.keys(value).length>0;
      return true;
    }
    function firstMeaningful(...values){return values.find(hasMeaningfulValue)}
    function preferIncoming(incoming,existing,fallback=''){return firstMeaningful(incoming,existing,fallback)}
    function preferStatus(incoming,existing,fallback='unconfirmed'){
      const incomingText=String(incoming??'');const existingText=String(existing??'');
      if(!hasMeaningfulValue(incoming))return preferIncoming(existing,fallback);
      if(WEAK_VALUES.has(incomingText)&&hasMeaningfulValue(existing)&&!WEAK_VALUES.has(existingText))return existing;
      return incoming;
    }

    function ensureState(state){
      state.schema_version=state.schema_version||'4.0';
      for(const key of ['products','yarns','organizations','materials','researchRecords','photoCaptureImports','auditLog'])if(!Array.isArray(state[key]))state[key]=[];
      if(!state.photoCaptureIdMap||typeof state.photoCaptureIdMap!=='object')state.photoCaptureIdMap={};
      return state;
    }

    function nextId(type,state){
      const [prefix,width]=PREFIX[type];
      const collections={yarn:state.yarns,product:state.products,material:state.materials,organization:state.organizations,research:state.researchRecords};
      const regex=new RegExp(`^${prefix}-(\\d{${width}})$`);let max=0;
      for(const row of collections[type]||[]){const match=String(row.id||row.commonId||'').match(regex);if(match)max=Math.max(max,Number(match[1]))}
      return `${prefix}-${String(max+1).padStart(width,'0')}`;
    }

    function finalId(type,candidate,state){
      const value=String(candidate||'').trim();
      if(value&&state.photoCaptureIdMap[value])return state.photoCaptureIdMap[value];
      const [prefix,width]=PREFIX[type];const valid=new RegExp(`^${prefix}-\\d{${width}}$`);
      const result=valid.test(value)?value:nextId(type,state);
      if(value&&value!==result)state.photoCaptureIdMap[value]=result;
      return result;
    }

    function resolveEntityId(type,candidate,override,state){
      const result=override?finalId(type,override,state):finalId(type,candidate,state);
      const source=String(candidate||'').trim();if(source&&source!==result)state.photoCaptureIdMap[source]=result;
      return result;
    }

    function upsert(collection,row){
      const existing=collection.find(item=>item.id===row.id||item.commonId===row.id);
      if(existing){for(const [key,value] of Object.entries(row)){if(hasMeaningfulValue(value))existing[key]=value}return existing}
      collection.unshift(row);return row;
    }

    function companyRows(payload,state,organizationOverrideId=''){
      const targetOrganizationId=payload.targetType==='organization'?payload.targetId:'';
      const definitions=[
        {name:payload.sourceOrganizationName,id:organizationOverrideId||payload.sourceOrganizationId||targetOrganizationId,role:'source'},
        {name:payload.manufacturerName,id:payload.manufacturerId,role:'yarn_manufacturer'},
        {name:payload.sellerName,id:payload.sellerId,role:'seller'}
      ];
      const result={};
      for(const definition of definitions){
        if(!definition.name&&!definition.id)continue;
        const id=resolveEntityId('organization',definition.id,'',state);
        const existing=state.organizations.find(row=>row.id===id);
        const roles=[...new Set([...(existing?.roles||[]),definition.role])];
        upsert(state.organizations,{id,commonId:id,name:preferIncoming(definition.name,existing?.name,'名称未確認'),officialName:preferIncoming(definition.name,existing?.officialName,''),roles,verificationStatus:preferStatus(payload.verificationStatus,existing?.verificationStatus,'candidate'),sourceCaptureId:payload.captureId,updated_at:now(),created_at:existing?.created_at||now()});
        result[definition.role]=id;
      }
      if(payload.targetType==='organization'&&payload.targetId&&result.source)state.photoCaptureIdMap[payload.targetId]=result.source;
      return result;
    }

    function countSystemLabel(value){return({Nm:'毛番手 Nm',Ne:'綿番手 Ne',D:'デニール D',dtex:'dtex',tex:'tex',unknown:'未確認'})[value]||value||'未確認'}
    function names(items){return(Array.isArray(items)?items:[]).map(item=>item.name||item.code).filter(Boolean)}

    function promote(item,overrideType,overrideId){
      const payload={...(item.payload||{}),captureId:item.capture_id};
      const state=ensureState(loadState());
      const reviewer=$('reviewer').value.trim()||'Owner Human Review';
      const companies=companyRows(payload,state,overrideType==='organization'?overrideId:'');
      const ids={};

      const yarnCandidate=payload.commonIds?.yarnId||(payload.targetType==='yarn'?payload.targetId:'');
      if(payload.yarnName||yarnCandidate){
        const id=resolveEntityId('yarn',yarnCandidate,overrideType==='yarn'?overrideId:'',state);ids.yarnId=id;
        const existing=state.yarns.find(row=>row.id===id);
        const incomingCountSystem=(payload.countValue||payload.countDisplay)?countSystemLabel(payload.countSystem):'';
        const incomingStructure=WEAK_VALUES.has(String(payload.basicYarnForm||''))?payload.yarnStructure:firstMeaningful(payload.yarnStructure,payload.basicYarnForm);
        upsert(state.yarns,{
          id,commonId:id,
          sourceTargetId:preferIncoming(yarnCandidate||payload.targetId,existing?.sourceTargetId,''),sourceCaptureId:item.capture_id,
          supplier:preferIncoming(firstMeaningful(payload.sourceOrganizationName,payload.sellerName,payload.manufacturerName),existing?.supplier,'未確認'),
          supplierOrganizationId:preferIncoming(firstMeaningful(companies.source,companies.seller),existing?.supplierOrganizationId,''),
          manufacturerOrganizationId:preferIncoming(companies.yarn_manufacturer,existing?.manufacturerOrganizationId,''),
          sellerOrganizationId:preferIncoming(companies.seller,existing?.sellerOrganizationId,''),
          name:preferIncoming(payload.yarnName,existing?.name,'糸名未確認'),code:preferIncoming(payload.yarnCode,existing?.code,''),
          countSystem:preferIncoming(incomingCountSystem,existing?.countSystem,''),countValue:preferIncoming(payload.countValue,existing?.countValue,''),
          plyCount:preferIncoming(payload.plyCount,existing?.plyCount,''),displayCount:preferIncoming(payload.countDisplay,existing?.displayCount,''),
          structure:preferIncoming(incomingStructure,existing?.structure,'未確認'),basicYarnForm:preferStatus(payload.basicYarnForm,existing?.basicYarnForm,'unconfirmed'),
          spinningMethod:preferStatus(payload.spinningMethod,existing?.spinningMethod,''),processingMethod:preferIncoming(payload.processingMethod,existing?.processingMethod,''),
          composition:preferIncoming(payload.compositionRaw,existing?.composition,''),compositionTotal:preferIncoming(payload.compositionTotal,existing?.compositionTotal,null),
          compositionStatus:preferStatus(payload.compositionStatus,existing?.compositionStatus,'unconfirmed'),gauge:preferIncoming(payload.gauge,existing?.gauge,''),
          functions:preferIncoming(names(payload.functionalProperties),existing?.functions,[]),functionalProperties:preferIncoming(payload.functionalProperties,existing?.functionalProperties,[]),
          sustainableAttributes:preferIncoming(payload.sustainableAttributes,existing?.sustainableAttributes,[]),status:'CONFIRMED',verificationStatus:'confirmed',
          sourceUrl:preferIncoming(payload.sourceUrl,existing?.sourceUrl,''),notes:preferIncoming(payload.notes,existing?.notes,''),evidenceId:preferIncoming(payload.evidenceId,existing?.evidenceId,''),
          reviewedAt:now(),reviewedBy:reviewer,created_at:existing?.created_at||now(),updated_at:now()
        });
      }

      const productCandidate=payload.commonIds?.productId||(payload.targetType==='product'?payload.targetId:'');
      if(payload.productName||productCandidate){
        const id=resolveEntityId('product',productCandidate,overrideType==='product'?overrideId:'',state);ids.productId=id;
        const existing=state.products.find(row=>row.id===id);
        const linked=[...new Set([...(existing?.linkedYarnIds||[]),ids.yarnId].filter(Boolean))];
        const sourceStatus=payload.verificationStatus==='confirmed'?'CONFIRMED':'';
        const incomingPriority=['URGENT','HIGH'].includes(payload.priority)?'A':'';
        upsert(state.products,{
          id,commonId:id,sourceTargetId:preferIncoming(productCandidate||payload.targetId,existing?.sourceTargetId,''),sourceCaptureId:item.capture_id,
          brand:preferIncoming(payload.brandName,existing?.brand,'ブランド未確認'),name:preferIncoming(payload.productName,existing?.name,'商品名未確認'),
          productNumber:preferIncoming(payload.productCode,existing?.productNumber,''),officialUrl:preferIncoming(payload.productUrl,existing?.officialUrl,''),
          composition:preferIncoming(payload.compositionRaw,existing?.composition,''),compositionStatus:preferStatus(payload.compositionStatus,existing?.compositionStatus,'unconfirmed'),
          functionalProperties:preferIncoming(payload.functionalProperties,existing?.functionalProperties,[]),sustainableAttributes:preferIncoming(payload.sustainableAttributes,existing?.sustainableAttributes,[]),
          workflowStatus:preferIncoming(existing?.workflowStatus,'NEW_PRODUCT'),releaseStatus:preferIncoming(existing?.releaseStatus,'UNKNOWN'),
          sourceStatus:preferIncoming(sourceStatus,existing?.sourceStatus,'CANDIDATE'),priority:preferIncoming(incomingPriority,existing?.priority,'B'),linkedYarnIds:linked,
          brandMemo:preferIncoming(payload.notes,existing?.brandMemo,''),research:existing?.research||{},reviewedAt:now(),reviewedBy:reviewer,
          created_at:existing?.created_at||now(),updated_at:now(),discoveredAt:existing?.discoveredAt||now().slice(0,10)
        });
      }

      const materialCandidate=payload.commonIds?.materialId||(payload.targetType==='material'?payload.targetId:'');
      if(payload.materialName||materialCandidate){
        const id=resolveEntityId('material',materialCandidate,overrideType==='material'?overrideId:'',state);ids.materialId=id;
        const existing=state.materials.find(row=>row.id===id);
        upsert(state.materials,{id,commonId:id,name:preferIncoming(firstMeaningful(payload.materialName,payload.yarnName),existing?.name,'素材名未確認'),composition:preferIncoming(payload.compositionRaw,existing?.composition,''),functionalProperties:preferIncoming(payload.functionalProperties,existing?.functionalProperties,[]),sustainableAttributes:preferIncoming(payload.sustainableAttributes,existing?.sustainableAttributes,[]),sourceCaptureId:item.capture_id,verificationStatus:'confirmed',created_at:existing?.created_at||now(),updated_at:now()});
      }

      const researchCandidate=payload.commonIds?.researchId||(payload.targetType==='research'?payload.targetId:'');
      if(researchCandidate){
        const id=resolveEntityId('research',researchCandidate,overrideType==='research'?overrideId:'',state);ids.researchId=id;
        const existing=state.researchRecords.find(row=>row.id===id);
        const verifiedFacts=payload.verificationStatus==='confirmed'?payload.notes:'';
        upsert(state.researchRecords,{id,commonId:id,targetType:preferIncoming(payload.targetType,existing?.targetType,''),targetId:preferIncoming(firstMeaningful(ids.yarnId,ids.productId,ids.materialId,payload.targetId),existing?.targetId,''),candidateAnswer:preferIncoming(payload.notes,existing?.candidateAnswer,''),verifiedFacts:preferIncoming(verifiedFacts,existing?.verifiedFacts,''),reviewStatus:'APPROVED',sourceCaptureId:item.capture_id,reviewedAt:now(),reviewedBy:reviewer,created_at:existing?.created_at||now(),updated_at:now()});
      }

      if(payload.targetType==='organization'){
        ids.organizationId=firstMeaningful(companies.source,companies.yarn_manufacturer,companies.seller);
        if(!ids.organizationId)ids.organizationId=resolveEntityId('organization',payload.targetId,overrideType==='organization'?overrideId:'',state);
        if(payload.targetId)state.photoCaptureIdMap[payload.targetId]=ids.organizationId;
      }
      ids.organizationIds=companies;
      state.photoCaptureImports.unshift({handoffId:item.handoff_id,captureId:item.capture_id,eventVersion:item.event_version,masterIds:ids,approvedAt:now(),approvedBy:reviewer});
      state.photoCaptureImports=state.photoCaptureImports.slice(0,500);
      state.auditLog.unshift({id:makeId('AUDIT'),at:now(),action:'APPROVE_AND_PROMOTE',entityType:'photo_capture_handoff',entityId:item.handoff_id,summary:`Photo Capture ${item.capture_id} を商品・糸・会社マスターへ確定反映`});
      state.auditLog=state.auditLog.slice(0,500);
      saveState(state);return ids;
    }

    function typeOptions(selected){return TYPE_OPTIONS.map(([value,label])=>`<option value="${value}" ${value===selected?'selected':''}>${label}</option>`).join('')}
    function itemTitle(payload){return payload.yarnName||payload.productName||payload.sourceOrganizationName||payload.materialName||'名称未入力'}
    function detailText(payload){return[`対象ID: ${payload.targetId||'未発行'}`,`混率: ${payload.compositionRaw||'未入力'}`,`機能性: ${names(payload.functionalProperties).join('、')||'未入力'}`,`サステナブル: ${names(payload.sustainableAttributes).join('、')||'未入力'}`,`メーカー: ${payload.manufacturerName||'未入力'}`,`販売会社: ${payload.sellerName||'未入力'}`,`根拠: ${payload.sourceUrl||payload.evidenceId||'未入力'}`,`メモ: ${payload.notes||'未入力'}`].join('\n')}

    function render(){
      const queue=loadQueue().sort((a,b)=>String(b.sent_at).localeCompare(String(a.sent_at)));
      const pending=queue.filter(item=>item.review_status==='PENDING').length,approved=queue.filter(item=>item.review_status==='APPROVED').length,rejected=queue.filter(item=>item.review_status==='REJECTED').length;
      $('pendingBadge').textContent=pending;$('pendingCount').textContent=pending;$('approvedCount').textContent=approved;$('rejectedCount').textContent=rejected;
      $('inboxList').innerHTML=queue.length?queue.map(item=>{const payload=item.payload||{},status=item.review_status||'PENDING';return`<article class="item ${status.toLowerCase()}"><div class="item-head"><div><span class="status ${status}">${status}</span><h2>${esc(itemTitle(payload))}</h2><div class="meta">${esc(item.capture_id)} / v${esc(item.event_version||1)} / ${esc(item.sent_at||'')}</div></div></div><div class="summary"><div><strong>混率</strong> ${esc(payload.compositionRaw||'未入力')}</div><div class="tag-row">${[...names(payload.functionalProperties),...names(payload.sustainableAttributes)].slice(0,8).map(value=>`<span class="tag">${esc(value)}</span>`).join('')}</div></div>${status==='PENDING'?`<div class="review-grid"><div class="field"><label>確定対象</label><select data-type="${esc(item.handoff_id)}">${typeOptions(payload.targetType||'yarn')}</select></div><div class="field"><label>正式ID（空欄は自動採番）</label><input data-final-id="${esc(item.handoff_id)}" placeholder="YN-00000001 等"></div></div><div class="item-actions"><button class="btn" data-approve="${esc(item.handoff_id)}">承認してマスター反映</button><button class="btn danger" data-reject="${esc(item.handoff_id)}">却下</button><button class="btn secondary" data-detail="${esc(item.handoff_id)}">詳細</button></div>`:`<div class="item-actions"><button class="btn secondary" data-detail="${esc(item.handoff_id)}">詳細</button></div><div class="meta">確認者: ${esc(item.reviewed_by||'—')} / ${esc(item.reviewed_at||'—')}${item.rejection_reason?` / 理由: ${esc(item.rejection_reason)}`:''}</div>`}<div class="details" id="detail-${esc(item.handoff_id)}">${esc(detailText(payload))}</div></article>`}).join(''):'<div class="empty">Photo Captureからの承認待ちはありません。</div>';
      document.querySelectorAll('[data-detail]').forEach(button=>button.addEventListener('click',()=>document.getElementById(`detail-${button.dataset.detail}`).classList.toggle('open')));
      document.querySelectorAll('[data-approve]').forEach(button=>button.addEventListener('click',()=>approve(button.dataset.approve)));
      document.querySelectorAll('[data-reject]').forEach(button=>button.addEventListener('click',()=>reject(button.dataset.reject)));
    }

    function approve(handoffId){
      const queue=loadQueue(),item=queue.find(row=>row.handoff_id===handoffId);if(!item||item.review_status!=='PENDING')return;
      const type=document.querySelector(`[data-type="${CSS.escape(handoffId)}"]`).value;
      const finalIdValue=document.querySelector(`[data-final-id="${CSS.escape(handoffId)}"]`).value.trim();
      const ok=confirm(`この候補をHuman Review承認し、商品・糸・会社マスターへ確定反映します。\n\n対象: ${TYPE_OPTIONS.find(row=>row[0]===type)?.[1]||type}\n正式ID: ${finalIdValue||'自動採番'}\n\n続行しますか？`);if(!ok)return;
      try{
        const ids=promote(item,type,finalIdValue);item.review_status='APPROVED';item.reviewed_at=now();item.reviewed_by=$('reviewer').value.trim()||'Owner Human Review';item.master_ids=ids;
        const result=saveQueue(queue);localStorage.setItem(REVIEWER_KEY,$('reviewer').value.trim());$('v04Frame').contentWindow.location.reload();
        setMessage(`承認しました。${Object.entries(ids).filter(([,value])=>typeof value==='string').map(([key,value])=>`${key}: ${value}`).join(' / ')||'マスター更新済み'}${result.prunedReviewed?`／古い承認済み・却下済み履歴${result.prunedReviewed}件を整理しました。`:''}`);render();
      }catch(error){setMessage(`承認処理に失敗しました: ${error.message||error}`,true)}
    }
    function reject(handoffId){
      const queue=loadQueue(),item=queue.find(row=>row.handoff_id===handoffId);if(!item||item.review_status!=='PENDING')return;
      const reason=prompt('却下理由を入力してください。','根拠不足');if(reason===null)return;
      item.review_status='REJECTED';item.reviewed_at=now();item.reviewed_by=$('reviewer').value.trim()||'Owner Human Review';item.rejection_reason=reason.trim()||'理由未記入';
      try{const result=saveQueue(queue);setMessage(`候補を却下しました。マスターは変更していません。${result.prunedReviewed?` 古い確認済み履歴${result.prunedReviewed}件を整理しました。`:''}`);render()}catch(error){setMessage(error.message||String(error),true)}
    }

    async function importFile(file){
      if(!file)return;
      try{
        const data=JSON.parse(await file.text());let incoming=[];
        if(data?.format==='KC_V04_INBOX_EXPORT'&&Array.isArray(data.items))incoming=data.items;else if(data?.format==='KC_V04_INBOX_ITEM')incoming=[data];else if(Array.isArray(data))incoming=data;else throw new Error('対応する受信箱JSONではありません');
        const queue=loadQueue(),keys=new Set(queue.map(queueKey));let added=0;
        for(const item of incoming){if(item?.format!=='KC_V04_INBOX_ITEM')continue;const key=queueKey(item);if(key&&keys.has(key))continue;queue.unshift(item);if(key)keys.add(key);added++}
        const result=saveQueue(queue);setMessage(`${added}件を受信箱へ取り込みました。未承認候補はすべて保持しています。${result.prunedReviewed?` 古い承認済み・却下済み履歴${result.prunedReviewed}件を整理しました。`:''}`);render();
      }catch(error){setMessage(`取込に失敗しました: ${error.message||error}`,true)}finally{$('importFile').value=''}
    }

    $('openInbox').addEventListener('click',openDrawer);$('closeInbox').addEventListener('click',closeDrawer);$('overlay').addEventListener('click',closeDrawer);$('importButton').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',()=>importFile($('importFile').files[0]));$('reviewer').value=localStorage.getItem(REVIEWER_KEY)||'Owner Human Review';$('reviewer').addEventListener('change',()=>localStorage.setItem(REVIEWER_KEY,$('reviewer').value.trim()));window.addEventListener('storage',event=>{if(event.key===HANDOFF_KEY)render()});
    if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=0.4.4').catch(()=>{});
    render();
  })();
  </script>
</body>
</html>
