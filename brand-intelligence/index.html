<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#163f3c">
  <meta name="application-name" content="Knit Compass">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Knit Compass">
  <title>Knit Compass — 独立実用版 v0.4</title>
  <link rel="manifest" href="./manifest.webmanifest?v=0.4.1">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <style>
    html,body{height:100%;margin:0;background:#f2f5f3;color:#172826;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(420px,100%);text-align:center;background:#fff;border:1px solid #d6dfdb;border-radius:18px;padding:28px;box-sizing:border-box}
    .mark{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 16px;border-radius:17px;background:#163f3c;color:#fff;font-weight:900;font-size:20px}
    h1{font-size:20px;margin:0 0 8px}p{font-size:13px;color:#5d6d69;margin:0}.error{color:#8a342e;white-space:pre-wrap}
  </style>
</head>
<body>
  <main><div class="mark">KC</div><h1>Knit Compassを起動しています</h1><p id="status">独立実用版 v0.4を読み込んでいます。</p></main>
  <script>
  (async()=>{
    const status=document.getElementById('status');
    try{
      if('serviceWorker' in navigator){
        navigator.serviceWorker.register('./sw.js?v=0.4.1').catch(()=>{});
      }
      if(typeof DecompressionStream==='undefined') throw new Error('このブラウザは起動方式に対応していません。Chromeを最新版にしてください。');
      const files=['./payload-01.b64?v=0.4.1','./payload-02.b64?v=0.4.1'];
      const parts=await Promise.all(files.map(async url=>{
        const response=await fetch(url,{cache:'no-store'});
        if(!response.ok) throw new Error(`起動データを取得できませんでした（${response.status}）`);
        return (await response.text()).trim();
      }));
      const binary=atob(parts.join(''));
      const bytes=Uint8Array.from(binary,char=>char.charCodeAt(0));
      const decompressed=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html=await new Response(decompressed).text();
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      status.className='error';
      status.textContent=`起動できませんでした。\n${error.message}\n通信状態を確認して再読み込みしてください。`;
    }
  })();
  </script>
</body>
</html>
