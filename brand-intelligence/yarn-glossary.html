<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#163f3c">
  <title>Knit Compass v0.4 — 中国糸名辞書</title>
  <style>
    :root{--ink:#172826;--muted:#5d6d69;--paper:#f2f5f3;--card:#fff;--teal:#163f3c;--teal2:#235c56;--line:#d6dfdb;--soft:#eef3f1;--amber:#9a6a20;--amber-bg:#fff5df;--green:#2f6a37;--green-bg:#e9f5e7;--red:#8a342e;--red-bg:#fff0ed}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}button,input,select{font:inherit}button{cursor:pointer}.shell{width:min(1180px,calc(100% - 24px));margin:0 auto;padding:18px 0 40px}.hero{background:linear-gradient(135deg,var(--teal),#235750);color:#fff;border-radius:18px;padding:22px}.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.12em;color:#cfe1da}.back{display:inline-flex;align-items:center;min-height:34px;border:1px solid rgba(255,255,255,.35);border-radius:9px;color:#fff;text-decoration:none;padding:6px 9px;font-size:9px;font-weight:900;white-space:nowrap}.hero h1{margin:5px 0 8px;font-size:clamp(24px,5vw,38px);letter-spacing:-.035em}.hero p{margin:0;color:#e4eeea;font-size:12px}.policy{margin-top:13px;padding:11px 12px;border:1px solid rgba(255,255,255,.24);border-radius:12px;background:rgba(255,255,255,.07);font-size:11px}.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 220px auto;gap:9px;margin:14px 0}.field{display:grid;gap:5px}.field label{font-size:10px;font-weight:900;color:var(--muted)}.field input,.field select{width:100%;min-height:44px;border:1px solid #bdcbc5;border-radius:10px;background:#fff;padding:9px 11px;color:var(--ink)}.btn{min-height:44px;border:1px solid var(--teal);border-radius:10px;background:var(--teal);color:#fff;padding:9px 13px;font-size:11px;font-weight:900}.btn.secondary{background:#fff;color:var(--teal);border-color:#aabcb5}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.stat span{display:block;color:var(--muted);font-size:9px;font-weight:900}.stat strong{display:block;font-size:24px;margin-top:2px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;display:grid;gap:11px}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.market{font-size:20px;font-weight:950;letter-spacing:-.02em}.jp{font-size:13px;font-weight:900;color:var(--teal);margin-top:2px}.priority{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;background:var(--amber-bg);color:var(--amber);font-size:9px;font-weight:900;white-space:nowrap}.row{display:grid;grid-template-columns:135px minmax(0,1fr);gap:9px;padding-top:9px;border-top:1px solid var(--line);font-size:11px}.row strong{color:var(--muted);font-size:9px}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{display:inline-flex;align-items:center;border:1px solid #cfddd4;border-radius:999px;background:#edf4ef;color:#31594c;padding:4px 8px;font-size:9px;font-weight:850}.tag.type{background:var(--green-bg);color:var(--green);border-color:#bdd6c0}.warning{border-left:4px solid var(--amber);background:#fff8e8;border-radius:0 10px 10px 0;padding:9px 11px;font-size:10px;color:#6f531d}.match{border-left:4px solid var(--teal);background:#f3f8f6;border-radius:0 10px 10px 0;padding:9px 11px;font-size:10px}.match strong{color:var(--teal)}.actions{display:flex;gap:7px;flex-wrap:wrap}.mini{min-height:34px;border:1px solid #aabcb5;border-radius:9px;background:#fff;color:var(--teal);padding:6px 9px;font-size:9px;font-weight:900}.empty{grid-column:1/-1;border:1px dashed #aebdb7;border-radius:14px;background:#fff;padding:28px;text-align:center;color:var(--muted);font-size:12px}.foot{margin-top:16px;color:var(--muted);font-size:9px}.error{background:var(--red-bg);color:var(--red);border:1px solid #e3bdb7;border-radius:12px;padding:14px}.toast{position:fixed;right:14px;bottom:14px;max-width:min(420px,calc(100% - 28px));background:var(--ink);color:#fff;border-radius:11px;padding:10px 13px;font-size:10px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.16s}.toast.show{opacity:1;transform:none}
    @media(max-width:760px){.toolbar{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.row{grid-template-columns:1fr;gap:3px}.shell{width:min(100% - 18px,1180px);padding-top:10px}.hero{padding:18px}.card{padding:14px}.hero-top{align-items:flex-start}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="hero-top"><div class="eyebrow">KC-CN-YARN-001 / V04</div><a class="back" href="./">V04本体へ戻る</a></div>
      <h1>中国語糸名 ↔ 日本語標準名</h1>
      <p>中国の展示会・BOOK・WeChatで見かける市場名を、日本のニット実務で想像しやすい名称と「代表的な糸タイプ（例）」へつなぎます。</p>
      <div class="policy"><strong>重要：</strong>「仿〇〇」「冰麻」「丝麻」は原料証明ではありません。見た目・風合い・商品カテゴリの市場名として扱い、天然繊維の有無は必ず混率で確認します。</div>
    </section>

    <section class="toolbar" aria-label="辞書検索">
      <div class="field"><label for="query">検索</label><input id="query" type="search" placeholder="例：仿貂绒、フェザー、包芯纱、リネン調"></div>
      <div class="field"><label for="category">分類</label><select id="category"><option value="">すべて</option></select></div>
      <div class="field"><label>&nbsp;</label><button class="btn secondary" id="clear">条件クリア</button></div>
    </section>

    <section class="stats">
      <div class="stat"><span>初期登録語</span><strong id="totalCount">—</strong></div>
      <div class="stat"><span>表示中</span><strong id="visibleCount">—</strong></div>
      <div class="stat"><span>V04糸マスター一致</span><strong id="masterMatchCount">—</strong></div>
    </section>

    <section class="grid" id="list"><div class="empty">辞書を読み込んでいます。</div></section>
    <div class="foot">Knit Compass v0.4 / 中国市場名は標準化補助。実混率・糸構造・紡績方法・メーカー確認を優先。</div>
  </main>
  <div class="toast" id="toast" role="status"></div>

<script>
(()=>{
  'use strict';
  const DATA_URL='./data/cn-yarn-glossary.json?v=1.0.0';
  const V04_KEY='kc_independent_practical_v0_4';
  const $=id=>document.getElementById(id);
  const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  const normalize=value=>String(value||'').toLowerCase().replace(/[／/・,、()（）\-]+/g,' ').replace(/\s+/g,' ').trim();
  let data={entries:[]};
  let masterYarns=[];

  function toast(text){const el=$('toast');el.textContent=text;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),1800)}
  async function copy(text){try{await navigator.clipboard.writeText(text);toast(`コピーしました：${text}`)}catch{toast('コピーできませんでした。')}}
  function loadMaster(){try{const state=JSON.parse(localStorage.getItem(V04_KEY)||'{}');masterYarns=Array.isArray(state.yarns)?state.yarns:[]}catch{masterYarns=[]}}
  function entryText(entry){return [entry.market_name,...(entry.aliases||[]),entry.japanese_name,...(entry.representative_yarn_types||[]),...(entry.common_fibers||[]),entry.category,...(entry.search_keywords||[]),...(entry.exhibition_checks||[])].join(' ')}
  function masterText(yarn){return [yarn.name,yarn.code,yarn.supplier,yarn.structure,yarn.composition,yarn.gauge,...(Array.isArray(yarn.functions)?yarn.functions:[]),yarn.notes].join(' ')}
  function aliasesForMatch(entry){return [entry.market_name,...(entry.aliases||[]),entry.japanese_name,...(entry.search_keywords||[])].flatMap(value=>String(value||'').split(/[／/]/)).map(normalize).filter(value=>value.length>=2)}
  function masterMatches(entry){const needles=aliasesForMatch(entry);return masterYarns.filter(yarn=>{const hay=normalize(masterText(yarn));return needles.some(needle=>hay.includes(needle))})}
  function tags(values,klass=''){return (values||[]).map(value=>`<span class="tag ${klass}">${esc(value)}</span>`).join('')}

  function render(){
    const query=normalize($('query').value),category=$('category').value;
    const entries=data.entries.filter(entry=>(!query||normalize(entryText(entry)).includes(query))&&(!category||entry.category===category));
    const matchedIds=new Set();data.entries.forEach(entry=>{if(masterMatches(entry).length)matchedIds.add(entry.id)});
    $('totalCount').textContent=data.entries.length;$('visibleCount').textContent=entries.length;$('masterMatchCount').textContent=matchedIds.size;
    $('list').innerHTML=entries.length?entries.map(entry=>{
      const matches=masterMatches(entry);
      return `<article class="card">
        <div class="card-head"><div><div class="market">${esc(entry.market_name)}</div><div class="jp">${esc(entry.japanese_name)}</div></div><span class="priority">初期優先 ${esc(entry.priority)}</span></div>
        <div><div style="font-size:9px;color:var(--muted);font-weight:900;margin-bottom:5px">代表的な糸タイプ（例）</div><div class="tags">${tags(entry.representative_yarn_types,'type')}</div></div>
        <div class="row"><strong>簡体字別名</strong><div class="tags">${tags(entry.aliases)}</div></div>
        <div class="row"><strong>よく使う実繊維</strong><div>${esc((entry.common_fibers||[]).join(' ／ '))}</div></div>
        <div class="row"><strong>分類</strong><div>${esc(entry.category)}</div></div>
        <div class="warning"><strong>天然対象繊維：</strong>${esc(entry.natural_target_fiber)}</div>
        <div class="row"><strong>検索キーワード</strong><div class="tags">${tags(entry.search_keywords)}</div></div>
        <div class="row"><strong>展示会確認ポイント</strong><div>${esc((entry.exhibition_checks||[]).join(' ／ '))}</div></div>
        <div class="match"><strong>V04糸マスター：</strong>${matches.length?`${matches.length}件一致 — ${matches.slice(0,3).map(y=>esc([y.supplier,y.name].filter(Boolean).join('｜'))).join('、')}${matches.length>3?' ほか':''}`:'現在の登録糸に一致なし'}</div>
        <div class="actions"><button class="mini" data-copy-cn="${esc(entry.market_name)}">中国語名をコピー</button><button class="mini" data-copy-jp="${esc(entry.japanese_name)}">日本語名をコピー</button><button class="mini" data-copy-type="${esc((entry.representative_yarn_types||[]).join('／'))}">糸タイプをコピー</button></div>
      </article>`;
    }).join(''):'<div class="empty">条件に一致する中国語糸名はありません。</div>';
    document.querySelectorAll('[data-copy-cn]').forEach(button=>button.addEventListener('click',()=>copy(button.dataset.copyCn)));
    document.querySelectorAll('[data-copy-jp]').forEach(button=>button.addEventListener('click',()=>copy(button.dataset.copyJp)));
    document.querySelectorAll('[data-copy-type]').forEach(button=>button.addEventListener('click',()=>copy(button.dataset.copyType)));
  }

  async function init(){
    try{
      const response=await fetch(DATA_URL,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);data=await response.json();if(!Array.isArray(data.entries))throw new Error('entriesがありません');
      loadMaster();const categories=[...new Set(data.entries.map(entry=>entry.category).filter(Boolean))].sort();$('category').innerHTML='<option value="">すべて</option>'+categories.map(value=>`<option value="${esc(value)}">${esc(value)}</option>`).join('');render();
    }catch(error){$('list').innerHTML=`<div class="error">中国糸名辞書を読み込めませんでした：${esc(error.message||error)}</div>`;$('totalCount').textContent='0';$('visibleCount').textContent='0';$('masterMatchCount').textContent='0'}
  }
  $('query').addEventListener('input',render);$('category').addEventListener('change',render);$('clear').addEventListener('click',()=>{$('query').value='';$('category').value='';render()});window.addEventListener('storage',event=>{if(event.key===V04_KEY){loadMaster();render()}});init();
})();
</script>
</body>
</html>
