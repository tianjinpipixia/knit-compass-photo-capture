name: Validate yarn taxonomy

on:
  pull_request:
    paths:
      - 'usage-metrics.js'
      - 'yarn-taxonomy-guard.js'
      - 'index.html'
      - 'brand-intelligence/data/cn-yarn-glossary.json'
      - 'brand-intelligence/data/cn-yarn-glossary-wave2.json'
      - 'brand-intelligence/yarn-glossary.html'
      - 'brand-intelligence/siro-glossary-augment.js'
      - 'scripts/validate_yarn_glossary.py'
      - 'scripts/validate_yarn_glossary_wave2.py'
      - 'scripts/validate_yarn_taxonomy.py'
      - '.github/workflows/validate-yarn-taxonomy.yml'
  push:
    paths:
      - 'usage-metrics.js'
      - 'yarn-taxonomy-guard.js'
      - 'index.html'
      - 'brand-intelligence/data/cn-yarn-glossary.json'
      - 'brand-intelligence/data/cn-yarn-glossary-wave2.json'
      - 'brand-intelligence/yarn-glossary.html'
      - 'brand-intelligence/siro-glossary-augment.js'
      - 'scripts/validate_yarn_glossary.py'
      - 'scripts/validate_yarn_glossary_wave2.py'
      - 'scripts/validate_yarn_taxonomy.py'
      - '.github/workflows/validate-yarn-taxonomy.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate preparation and spinning taxonomy
        run: python scripts/validate_yarn_taxonomy.py
      - name: Validate China yarn glossary and fancy-yarn taxonomy
        run: python scripts/validate_yarn_glossary.py
      - name: Validate KIMI wave2 glossary additions
        run: python scripts/validate_yarn_glossary_wave2.py
