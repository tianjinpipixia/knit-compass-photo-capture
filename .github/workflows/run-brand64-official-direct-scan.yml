name: Run Brand64 official direct collection

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/run_brand64_free_direct_scan.py
      - scripts/brand64_flash_pipeline.py
      - scripts/brand64_canonical_store.py
      - scripts/brand64_daily_pipeline_binding.py
      - scripts/publish_brand64_flash_feed.py
      - scripts/merge_brand64_retrospective_sources.py
      - scripts/restore_brand64_valid_state.py
      - scripts/brand_direct_adapters.py
      - tests/test_brand64_free_direct_scan.py
      - tests/test_brand64_flash_pipeline.py
      - tests/test_brand64_daily_pipeline_binding.py
      - tests/test_brand64_retrospective_unification.py
      - tests/test_brand64_retrospective_month_evidence.py
      - data/brand-md-monitoring/retrospective/**/*.json
      - data/brand-md-monitoring/retrospective/*.json
      - data/brand-md-monitoring/2026-spring-retrospective-baselines.json
      - data/brand-md-monitoring/2026-08-*-product-baseline-snapshots.jsonl
      - data/brand-md-monitoring/2026-08-*-initial-baseline.jsonl
      - config/brand64-free-direct-sources.json
      - config/brand64-active-brands.json
      - .github/workflows/run-brand64-official-direct-scan.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: brand64-official-direct-scan
  cancel-in-progress: false

jobs:
  direct-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify collection, recovery, preservation, snapshot binding, and retrospective unification
        run: |
          python -m unittest discover -s tests -p test_brand64_free_direct_scan.py -v
          python -m unittest discover -s tests -p test_brand64_flash_pipeline.py -v
          python -m unittest discover -s tests -p test_brand64_daily_pipeline_binding.py -v
          python -m unittest discover -s tests -p test_brand64_retrospective_unification.py -v
          python -m unittest discover -s tests -p test_brand64_retrospective_month_evidence.py -v
          python -m unittest discover -s tests -p test_brand64_canonical_store.py -v
          python -m py_compile scripts/restore_brand64_valid_state.py scripts/brand64_daily_pipeline_binding.py

      - name: Restore newest strict-valid Brand64 state
        id: restore
        run: python scripts/restore_brand64_valid_state.py

      - name: Refresh cumulative feed from saved retrospective evidence
        id: retro_feed
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/publish_brand64_flash_feed.py

      - name: Collect and checkpoint flash observations for all brands
        id: flash
        continue-on-error: true
        run: python scripts/run_brand64_free_direct_scan.py --stage flash --budget-seconds 180 --max-pages 2

      - name: Make flash available before recovery or detail research
        if: always() && steps.flash.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: brand64-free-direct-${{ github.run_id }}-${{ github.run_attempt }}-flash
          path: data/brand-md-monitoring/direct-scans/
          if-no-files-found: error
          retention-days: 30

      - name: Publish saved flash to the owner screen
        id: feed_flash
        if: always() && steps.flash.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/publish_brand64_flash_feed.py

      - name: Recover pending pages and transient failures in the same daily run
        id: retry
        if: always() && steps.flash.outcome == 'success'
        continue-on-error: true
        run: python scripts/run_brand64_free_direct_scan.py --stage retry --budget-seconds 240 --max-pages 4

      - name: Enrich selected products after flash has been saved
        id: deep
        if: always() && steps.flash.outcome == 'success'
        continue-on-error: true
        run: python scripts/run_brand64_free_direct_scan.py --stage deep --budget-seconds 90

      - name: Check every brand for unresolved coverage
        id: coverage
        if: always() && steps.flash.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/run_brand64_free_direct_scan.py --stage check
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "state=PARTIAL_COVERAGE" >> "$GITHUB_OUTPUT"
            echo "::warning title=Brand64 coverage hold::Collection results were saved, but registered-scope coverage is incomplete. PUBLISH_HOLD and Human Review Required remain in force."
            exit 0
          fi
          if [ "$rc" -eq 0 ]; then
            echo "state=COMPLETE_REGISTERED_SCOPE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "state=CHECK_ERROR" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Record saved-result coverage hold
        if: always() && steps.coverage.outputs.state == 'PARTIAL_COVERAGE'
        run: |
          echo "## Brand64 daily outcome" >> "$GITHUB_STEP_SUMMARY"
          echo "- Collection pipeline: SUCCESS (results saved)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Coverage: PARTIAL_COVERAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publication: PUBLISH_HOLD" >> "$GITHUB_STEP_SUMMARY"
          echo "- Human Review Required: true" >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh the owner screen with recovery and detail status
        id: feed_final
        if: always() && steps.flash.outcome == 'success'
        continue-on-error: true
        run: python scripts/publish_brand64_flash_feed.py

      - name: Bind validated canonical snapshot to this collection run
        id: bind_snapshot
        if: always() && steps.feed_final.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/brand64_daily_pipeline_binding.py create-publish \
            --date "$(date +%F)" \
            --collection-run-id "$GITHUB_RUN_ID" \
            --collection-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --collector-source-sha "$GITHUB_SHA"

      - name: Upload final observations and recovery state
        if: always() && steps.flash.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: brand64-free-direct-${{ github.run_id }}-${{ github.run_attempt }}-final
          path: data/brand-md-monitoring/direct-scans/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve results and show the flash report
        if: always() && steps.flash.outcome != 'skipped'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scan_branch="brand64/direct-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$scan_branch"
          git add data/brand-md-monitoring/direct-scans
          if ! git diff --cached --quiet; then
            git commit -m "Preserve flash observations, coverage gaps and selected research"
            git push origin "HEAD:refs/heads/$scan_branch"
          fi
          echo "Pipeline stage: OFFICIAL_COLLECTION / collector=CHATGPT_OFFICIAL_DIRECT" >> "$GITHUB_STEP_SUMMARY"
          echo "Observation records: $scan_branch. AI API requests: 0." >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/brand-md-monitoring/direct-scans/snapshot-binding.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p=json.load(open('data/brand-md-monitoring/direct-scans/snapshot-binding.json'))
          print(f"Canonical snapshot: {p['canonical_unique_product_count']} products / manifest {p['canonical_manifest_sha256'][:12]}… / collection run {p['collection_run_id']}")
          PY
          fi
          if [ -f data/brand-md-monitoring/direct-scans/summary.md ]; then
            cat data/brand-md-monitoring/direct-scans/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail visibly when the collection pipeline itself is broken
        if: always() && (steps.restore.outcome != 'success' || steps.retro_feed.outcome != 'success' || steps.flash.outcome != 'success' || steps.retry.outcome != 'success' || steps.deep.outcome != 'success' || steps.coverage.outcome != 'success' || steps.feed_final.outcome != 'success' || steps.bind_snapshot.outcome != 'success')
        run: |
          echo "Brand64 collection/persistence pipeline failed. This is distinct from a saved PARTIAL_COVERAGE hold; inspect the failed operational step." >&2
          exit 1
