name: Apply PR16 follow-up fixes

"on":
  push:
    branches:
      - fix/pr15-review-data-safety-20260804
    paths:
      - "scripts/apply_pr16_followup_fixes.py"
      - "scripts/apply_pr16_followup_fixes_v2.py"
      - "scripts/apply_pr16_followup_fixes_v3.py"
      - ".github/workflows/apply-pr16-followup-fixes.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/apply_pr16_followup_fixes.py"
      - "scripts/apply_pr16_followup_fixes_v2.py"
      - "scripts/apply_pr16_followup_fixes_v3.py"
      - ".github/workflows/apply-pr16-followup-fixes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr15-review-data-safety-20260804
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Apply targeted follow-up fixes
        run: python scripts/apply_pr16_followup_fixes_v3.py
      - name: Validate Human Review safety
        run: python scripts/validate_handoff_safety.py
      - name: Validate system registry
        run: python scripts/validate_system_registry.py
      - name: Commit generated fixes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html brand-intelligence/index.html brand-intelligence/sw.js config/system-registry.json README.md docs/PHOTO_CAPTURE_HANDOFF.md docs/SYSTEM_REGISTRY.md scripts/validate_handoff_safety.py
          git commit -m "Harden save and approval flows after PR #16 review"
          git push origin HEAD:fix/pr15-review-data-safety-20260804
