name: Validate Human Review and Photo Capture state safety

"on":
  pull_request:
    paths:
      - "app.js"
      - "app-state-guard.js"
      - "index.html"
      - "brand-intelligence/index.html"
      - "scripts/validate_handoff_safety.py"
      - "scripts/validate_ui_state_guard.py"
      - ".github/workflows/validate-handoff-safety.yml"
      - ".github/workflows/validate-system-registry.yml"
  push:
    branches:
      - main
    paths:
      - "app.js"
      - "app-state-guard.js"
      - "index.html"
      - "brand-intelligence/index.html"
      - "scripts/validate_handoff_safety.py"
      - "scripts/validate_ui_state_guard.py"
      - ".github/workflows/validate-handoff-safety.yml"
      - ".github/workflows/validate-system-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Human Review data safety and JavaScript syntax
        run: python scripts/validate_handoff_safety.py
      - name: Validate save, resend, and editor recovery guards
        run: python scripts/validate_ui_state_guard.py
