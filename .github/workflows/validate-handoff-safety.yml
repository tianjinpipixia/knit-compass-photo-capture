name: Validate Human Review safety

"on":
  pull_request:
    paths:
      - "app.js"
      - "brand-intelligence/index.html"
      - "scripts/validate_handoff_safety.py"
      - ".github/workflows/validate-handoff-safety.yml"
  push:
    branches:
      - main
    paths:
      - "app.js"
      - "brand-intelligence/index.html"
      - "scripts/validate_handoff_safety.py"
      - ".github/workflows/validate-handoff-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate queue retention, partial upserts, organization mapping, and syntax
        run: python scripts/validate_handoff_safety.py
