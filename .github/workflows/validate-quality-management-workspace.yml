name: Validate quality management workspace

"on":
  pull_request:
    paths:
      - ".github/workflows/validate-quality-management-workspace.yml"
      - "quality_management_workspace_v1/**"
      - "fabric-inspection/**"
      - "scripts/validate_quality_management_workspace.py"
      - "scripts/validate_quality_model.js"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-quality-management-workspace.yml"
      - "quality_management_workspace_v1/**"
      - "fabric-inspection/**"
      - "scripts/validate_quality_management_workspace.py"
      - "scripts/validate_quality_model.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workspace structure and safety boundaries
        run: python3 scripts/validate_quality_management_workspace.py
      - name: Check quality JavaScript syntax
        run: |
          node --check fabric-inspection/quality-model.js
          node --check fabric-inspection/app.js
          node --check quality_management_workspace_v1/app.js
      - name: Validate quality model behavior
        run: node scripts/validate_quality_model.js
