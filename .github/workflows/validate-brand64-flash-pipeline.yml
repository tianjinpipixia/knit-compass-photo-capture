name: Validate Brand64 flash and recovery

on:
  pull_request:
    paths:
      - config/brand64-identity-resolutions.json
      - config/brand64-free-direct-sources.json
      - scripts/brand64_identity_guard.py
      - tests/test_brand64_identity_guard.py
      - scripts/brand64_canonical_store.py
      - scripts/publish_brand64_flash_feed.py
      - scripts/merge_brand64_retrospective_sources.py
      - scripts/restore_brand64_valid_state.py
      - tests/test_brand64_canonical_store.py
      - scripts/run_brand64_free_direct_scan.py
      - scripts/brand64_flash_pipeline.py
      - scripts/brand_direct_adapters.py
      - tests/test_brand64_free_direct_scan.py
      - tests/test_brand64_flash_pipeline.py
      - .github/workflows/run-brand64-gemini-primary-scan.yml
      - .github/workflows/validate-brand64-flash-pipeline.yml

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p test_brand64_free_direct_scan.py -v
      - run: python -m unittest discover -s tests -p test_brand64_flash_pipeline.py -v
      - run: python -m unittest discover -s tests -p 'test_brand64*.py' -v
