name: Monitor brand64 daily freshness

"on":
  schedule:
    - cron: "40 21 * * *"
  pull_request:
    paths:
      - "config/brand64-active-brands.json"
      - "config/brand64-md-monitoring.json"
      - "config/brand-md-analysis-framework.json"
      - "config/proposal-workspace-month-scope-contract.json"
      - "data/brand-md-monitoring/**"
      - "docs/BRAND64_DAILY_MD_MONITORING.md"
      - "docs/CODEX_MD_MONTH_PRODUCT_FILTER_TASK.md"
      - "scripts/validate_brand64_daily_freshness.py"
      - "scripts/validate_brand_md_analysis_framework.py"
      - "scripts/validate_proposal_workspace_month_scope.py"
      - ".github/workflows/monitor-brand64-daily-freshness.yml"
  push:
    branches: [main]
    paths:
      - "config/brand64-active-brands.json"
      - "config/brand64-md-monitoring.json"
      - "config/brand-md-analysis-framework.json"
      - "config/proposal-workspace-month-scope-contract.json"
      - "data/brand-md-monitoring/**"
      - "docs/BRAND64_DAILY_MD_MONITORING.md"
      - "docs/CODEX_MD_MONTH_PRODUCT_FILTER_TASK.md"
      - "scripts/validate_brand64_daily_freshness.py"
      - "scripts/validate_brand_md_analysis_framework.py"
      - "scripts/validate_proposal_workspace_month_scope.py"
      - ".github/workflows/monitor-brand64-daily-freshness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brand64-daily-freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require a current active 64-brand observation and matching proposals
        run: python scripts/validate_brand64_daily_freshness.py --max-age-days 1
      - name: Validate tiered brand MD analysis framework
        run: python scripts/validate_brand_md_analysis_framework.py
      - name: Validate proposal-workspace month-scoped product selection contract
        run: python scripts/validate_proposal_workspace_month_scope.py
