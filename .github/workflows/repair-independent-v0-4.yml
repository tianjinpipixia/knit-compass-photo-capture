name: Repair independent v0.4 payload to exact master

on:
  push:
    branches:
      - validate/independent-v0-4-payload-20260724
    paths:
      - '.github/workflows/repair-independent-v0-4.yml'
      - 'brand-intelligence/payload-*.b64'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validate/independent-v0-4-payload-20260724
      - name: Remove PWA-only insertions from embedded master
        shell: python
        run: |
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          root = Path('brand-intelligence')
          encoded = ''.join((root / name).read_text(encoding='utf-8').strip() for name in ('payload-01.b64','payload-02.b64'))
          html = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')

          head_block = '''  <meta name="theme-color" content="#163f3c">\n  <meta name="application-name" content="Knit Compass">\n  <meta name="mobile-web-app-capable" content="yes">\n  <meta name="apple-mobile-web-app-capable" content="yes">\n  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">\n  <meta name="apple-mobile-web-app-title" content="Knit Compass">\n  <link rel="manifest" href="./manifest.webmanifest?v=0.4.0">\n  <link rel="icon" href="./icon.svg" type="image/svg+xml">\n  <link rel="apple-touch-icon" href="./icon.svg">\n'''
          tail_block = '''<script>\n  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {\n    window.addEventListener('load', () => {\n      navigator.serviceWorker.register('./sw.js?v=0.4.0').catch(error => console.warn('Service worker registration failed:', error));\n    });\n  }\n</script>\n'''

          if head_block in html:
              html = html.replace(head_block, '', 1)
          if tail_block in html:
              html = html.replace(tail_block, '', 1)

          raw = html.encode('utf-8')
          digest = hashlib.sha256(raw).hexdigest()
          expected = 'd3b8c3353e63bde4189b1e975542be87683bc17361d21e91b1875fbc7358b38f'
          if digest != expected:
              raise SystemExit(f'Repaired HTML does not match master: {digest}')

          packed = base64.b64encode(gzip.compress(raw, compresslevel=9, mtime=0)).decode('ascii')
          split = 19000
          (root / 'payload-01.b64').write_text(packed[:split], encoding='utf-8')
          (root / 'payload-02.b64').write_text(packed[split:], encoding='utf-8')
          print(f'PASS: {len(raw)} bytes, SHA-256 {digest}, encoded {len(packed)} chars')
      - name: Commit repaired payload
        shell: bash
        run: |
          if git diff --quiet -- brand-intelligence/payload-01.b64 brand-intelligence/payload-02.b64; then
            echo 'Payload already matches the exact master.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brand-intelligence/payload-01.b64 brand-intelligence/payload-02.b64
          git commit -m 'Restore exact independent v0.4 HTML master'
          git push origin HEAD:validate/independent-v0-4-payload-20260724
