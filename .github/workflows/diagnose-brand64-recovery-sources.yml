name: Diagnose Brand64 recovery sources
on:
  push:
    branches: [fix/brand64-key-source-categories-20260910]
    paths: ['.github/workflows/diagnose-brand64-recovery-sources.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure selected official category responses
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          urls={
            'anysis-pp1':'https://crosset.onward.co.jp/items?bc=007&gc=2&scc=1004&pp=1',
            'anysis-pp4':'https://crosset.onward.co.jp/items?bc=007&gc=2&scc=1004&pp=4',
            'unfilo-pp1':'https://crosset.onward.co.jp/items?bc=105&gc=2&scc=1004&pp=1',
            'unfilo-pp4':'https://crosset.onward.co.jp/items?bc=105&gc=2&scc=1004&pp=4',
          }
          for name,url in urls.items():
            print('\n###',name,url)
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 KnitCompass/0.4','Accept-Language':'ja-JP,ja;q=0.9'})
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                body=r.read(8_000_001)
                text=body.decode(r.headers.get_content_charset() or 'utf-8','replace')
                print('final',r.geturl(),'bytes',len(body),'name_links',text.count('c-item-card__name-link'))
                m=re.search(r'c-item-card__name[^>]*>([^<]+)',text)
                if m: print('first_name',re.sub(r'\s+',' ',m.group(1)).strip())
            except Exception as e:
              print('ERROR',type(e).__name__,str(e)[:240])
          PY
