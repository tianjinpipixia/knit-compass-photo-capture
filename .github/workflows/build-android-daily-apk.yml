name: Build Knit Compass Android APK

on:
  pull_request:
    paths:
      - 'android-daily/**'
      - 'brand-intelligence/app.html'
      - '.github/workflows/build-android-daily-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Verify exact v0.4 HTML master
        shell: bash
        run: |
          test "$(sha256sum brand-intelligence/app.html | awk '{print $1}')" = 'd3b8c3353e63bde4189b1e975542be87683bc17361d21e91b1875fbc7358b38f'

      - name: Build debug APK
        shell: bash
        run: gradle -p android-daily :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK='android-daily/app/build/outputs/apk/debug/app-debug.apk'
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          EXPECTED_HTML_SHA='d3b8c3353e63bde4189b1e975542be87683bc17361d21e91b1875fbc7358b38f'
          test -s "$APK"
          test -x "$APKSIGNER"
          test -x "$AAPT2"
          "$APKSIGNER" verify --verbose "$APK"
          test "$(unzip -p "$APK" assets/app.html | sha256sum | awk '{print $1}')" = "$EXPECTED_HTML_SHA"
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml | tee android-manifest.txt
          grep -Eq 'allowBackup\(.*\)=false$' android-manifest.txt
          sha256sum "$APK" | tee apk-sha256.txt
          cp "$APK" Knit-Compass-Daily-v0.4.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Knit-Compass-Daily-v0.4-APK
          path: |
            Knit-Compass-Daily-v0.4.apk
            apk-sha256.txt
          if-no-files-found: error
