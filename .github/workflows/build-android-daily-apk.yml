name: Build Knit Compass Android APK

on:
  pull_request:
    paths:
      - 'android-daily/**'
      - 'brand-intelligence/app.html'
      - '.github/workflows/build-android-daily-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Bundle exact v0.4 HTML master
        shell: bash
        run: |
          mkdir -p android-daily/app/src/main/assets
          cp brand-intelligence/app.html android-daily/app/src/main/assets/app.html
          test "$(sha256sum android-daily/app/src/main/assets/app.html | awk '{print $1}')" = 'd3b8c3353e63bde4189b1e975542be87683bc17361d21e91b1875fbc7358b38f'

      - name: Build debug APK
        shell: bash
        run: gradle -p android-daily :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK='android-daily/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          apksigner verify --verbose "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
          cp "$APK" Knit-Compass-Daily-v0.4.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Knit-Compass-Daily-v0.4-APK
          path: |
            Knit-Compass-Daily-v0.4.apk
            apk-sha256.txt
          if-no-files-found: error
