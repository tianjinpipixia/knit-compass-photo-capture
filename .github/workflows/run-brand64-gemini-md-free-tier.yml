name: Run Brand64 Gemini MD analysis

on:
  workflow_dispatch:
    inputs:
      collection_run_id:
        description: Exact official collection run ID
        required: true
        type: string
      canonical_commit:
        description: Full commit SHA on brand64/flash-feed
        required: true
        type: string
      manifest_sha256:
        description: SHA-256 of that commit's cumulative-products/manifest.json
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: brand64-gemini-md-analysis
  cancel-in-progress: false

jobs:
  gemini-md:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Tokyo
      GEMINI_MD_MODEL: ${{ vars.GEMINI_MD_MODEL || 'gemini-3.5-flash-lite' }}
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_COLLECTION_RUN_ID: ${{ inputs.collection_run_id }}
      CANONICAL_COMMIT: ${{ inputs.canonical_commit }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      UPSTREAM_COLLECTION_CONCLUSION: manual

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore and verify the exact official collection snapshot
        shell: bash
        run: |
          # Validate untrusted input before using it as a Git argument.
          [[ "$CANONICAL_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$UPSTREAM_COLLECTION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          git fetch --no-tags origin brand64/flash-feed:refs/remotes/origin/brand64/flash-feed
          git merge-base --is-ancestor "$CANONICAL_COMMIT" refs/remotes/origin/brand64/flash-feed
          git restore --source="$CANONICAL_COMMIT" --worktree -- data/brand-md-monitoring/direct-scans
          python scripts/brand64_daily_pipeline_binding.py verify-manual \
            --date "$(date +%F)" \
            --expected-collection-run-id "$UPSTREAM_COLLECTION_RUN_ID" \
            --canonical-commit "$CANONICAL_COMMIT" \
            --manifest-sha256 "$MANIFEST_SHA256"

      - name: Verify free-tier pacing, quota-stop behavior, and pipeline binding
        run: |
          python -m unittest discover -s tests -p test_brand64_gemini_md_free_tier.py -v
          python -m unittest discover -s tests -p test_brand64_daily_pipeline_binding.py -v
          python -m unittest discover -s tests -p test_brand64_gemini_md_status.py -v

      - name: Restore current MD history and last successful artifact
        shell: bash
        run: |
          handoff_refs=$(git ls-remote --heads origin 'refs/heads/brand64/gemini-md-*')
          if [ -n "$handoff_refs" ]; then
            git fetch --depth=1 origin '+refs/heads/brand64/gemini-md-*:refs/remotes/origin/brand64/gemini-md-*'
          else
            echo "No remote MD handoff history; restoring artifacts from the checkout."
          fi
          python scripts/brand64_gemini_md_status.py restore

      - name: Run Gemini MD pass with URL Context only
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        continue-on-error: true
        run: |
          touch /tmp/gemini-md-attempt-start
          python scripts/run_brand64_gemini_md_free_tier.py \
            --date "$(date +%F)" \
            --collection-run-id "$UPSTREAM_COLLECTION_RUN_ID" \
            --canonical-commit "$CANONICAL_COMMIT" \
            --manifest-sha256 "$MANIFEST_SHA256" \
            --required-confirmed 39 \
            --batch-size 13 \
            --max-batches 5 \
            --cooldown-seconds 65

      - name: Stamp Gemini result with its exact canonical input generation
        id: stamp
        if: always() && steps.gemini.outcome != 'skipped'
        shell: bash
        run: |
          if [ data/brand-md-monitoring/gemini-md/latest.json -nt /tmp/gemini-md-attempt-start ]; then
            python scripts/brand64_daily_pipeline_binding.py stamp-gemini \
              --analysis-run-id "$GITHUB_RUN_ID" \
              --analysis-run-attempt "$GITHUB_RUN_ATTEMPT" \
              --expected-collection-run-id "$UPSTREAM_COLLECTION_RUN_ID"
          else
            echo "Gemini did not produce an artifact to bind; collection snapshot remains valid and independent." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Gemini MD artifact
        if: always() && steps.gemini.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: brand64-gemini-md-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/brand-md-monitoring/gemini-md/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve Gemini MD results on a handoff branch
        if: always() && steps.gemini.outcome != 'skipped'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- data/brand-md-monitoring/gemini-md)" ]; then
            branch="brand64/gemini-md-$(date +%F)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git checkout -b "$branch"
            git add data/brand-md-monitoring/gemini-md
            git commit -m "Brand64 Gemini MD analysis $(date +%F)"
            git push origin "HEAD:refs/heads/$branch"
            echo "Gemini MD artifact preserved on $branch" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report daily pipeline architecture
        if: always()
        run: |
          echo "Current runner outcome: ${{ steps.gemini.outcome }} (if no new artifact, MD pointer remains historical)." >> "$GITHUB_STEP_SUMMARY"
          python scripts/brand64_gemini_md_status.py summary >> "$GITHUB_STEP_SUMMARY"
          echo "Pipeline stage: MD_ANALYSIS / analyzer=GEMINI_PRIMARY" >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream collection run: ${UPSTREAM_COLLECTION_RUN_ID:-manual} / conclusion=${UPSTREAM_COLLECTION_CONCLUSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "Gemini model: ${GEMINI_MD_MODEL}" >> "$GITHUB_STEP_SUMMARY"
          echo "Input rule: only the SHA-256-bound CHATGPT_OFFICIAL_DIRECT canonical generation is analyzable." >> "$GITHUB_STEP_SUMMARY"
          echo "Google Search grounding: disabled" >> "$GITHUB_STEP_SUMMARY"
          echo "URL Context only; 13 brands/request; 65s pacing; one 429 retry then abort." >> "$GITHUB_STEP_SUMMARY"
          echo "Gemini success is never counted as official collection completion." >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce 39-brand analysis completion
        if: always() && steps.gemini.outcome != 'success'
        run: |
          echo "Gemini MD analysis did not confirm 39 brands. Any produced artifact was preserved and bound to its source snapshot; official collection remains independently usable." >&2
          exit 1
