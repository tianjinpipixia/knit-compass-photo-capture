name: Validate independent v0.4 payload

on:
  pull_request:
    paths:
      - 'brand-intelligence/**'
      - '.github/workflows/validate-independent-v0-4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compressed source and direct HTML master
        shell: python
        run: |
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          root = Path('brand-intelligence')
          encoded = ''.join(
              (root / name).read_text(encoding='utf-8').strip()
              for name in ('payload-01.b64', 'payload-02.b64')
          )
          reconstructed = gzip.decompress(base64.b64decode(encoded, validate=True))
          direct = (root / 'app.html').read_bytes()
          expected = '20333a01649bf5c71e4d0734f10e3e822b91ba4cbe9405cc9d8e37c52087cde1'
          reconstructed_hash = hashlib.sha256(reconstructed).hexdigest()
          direct_hash = hashlib.sha256(direct).hexdigest()
          assert reconstructed_hash == expected, reconstructed_hash
          assert direct_hash == expected, direct_hash
          assert reconstructed == direct
          text = direct.decode('utf-8')
          assert '<title>Knit Compass — 独立実用版 v0.4.7</title>' in text
          assert "const STORAGE_KEY='kc_independent_practical_v0_4';" in text
          print(f'PASS: {len(direct)} bytes, SHA-256 {direct_hash}')
