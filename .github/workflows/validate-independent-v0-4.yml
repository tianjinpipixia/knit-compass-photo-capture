name: Validate independent v0.4 payload

on:
  pull_request:
    paths:
      - 'brand-intelligence/**'
      - '.github/workflows/validate-independent-v0-4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Reconstruct received HTML master
        id: validate
        shell: python
        run: |
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          root = Path('brand-intelligence')
          part1 = (root / 'payload-01.b64').read_text(encoding='utf-8').strip()
          part2 = (root / 'payload-02.b64').read_text(encoding='utf-8').strip()
          html = gzip.decompress(base64.b64decode(part1 + part2, validate=True))
          digest = hashlib.sha256(html).hexdigest()
          expected = 'd3b8c3353e63bde4189b1e975542be87683bc17361d21e91b1875fbc7358b38f'
          if digest != expected:
              raise SystemExit(f'SHA-256 mismatch: {digest}')
          text = html.decode('utf-8')
          assert '<title>Knit Compass — 独立実用版 v0.4</title>' in text
          assert "const STORAGE_KEY='kc_independent_practical_v0_4';" in text
          (root / 'app.html').write_bytes(html)
          print(f'PASS: {len(html)} bytes, SHA-256 {digest}')
      - name: Commit direct HTML to pull-request branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- brand-intelligence/app.html)" ]; then
            echo 'Direct app.html already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brand-intelligence/app.html
          git commit -m 'Add direct exact v0.4 HTML master'
          git push origin HEAD:${{ github.head_ref }}
