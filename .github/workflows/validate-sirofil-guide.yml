name: Validate Sirofil guide

"on":
  pull_request:
    paths:
      - "brand-intelligence/sirofil-guide.html"
      - "scripts/validate_sirofil_guide.py"
      - ".github/workflows/validate-sirofil-guide.yml"
  push:
    branches: [main]
    paths:
      - "brand-intelligence/sirofil-guide.html"
      - "scripts/validate_sirofil_guide.py"
      - ".github/workflows/validate-sirofil-guide.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Siro / Sirofil / Core-spun separation
        run: python scripts/validate_sirofil_guide.py
