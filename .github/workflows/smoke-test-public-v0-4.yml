name: Smoke test public independent v0.4

on:
  pull_request:
    paths:
      - '.github/workflows/smoke-test-public-v0-4.yml'
      - 'brand-intelligence/**'
      - 'daily/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify direct deployed HTTPS app and plain Android shortcut
        shell: python
        run: |
          import hashlib
          import json
          import time
          import urllib.request

          root = 'https://tianjinpipixia.github.io/knit-compass-photo-capture/'
          expected = 'd3b8c3353e63bde4189b1e975542be87683bc17361d21e91b1875fbc7358b38f'

          def get(url):
              request = urllib.request.Request(url, headers={'User-Agent':'Knit-Compass-Smoke-Test/1.0'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f'{url}: HTTP {response.status}')
                  return response.read()

          for attempt in range(1, 21):
              try:
                  base = root + 'brand-intelligence/'
                  index = get(base).decode('utf-8')
                  assert 'app.html?v=0.4.2' in index
                  assert 'DecompressionStream' not in index
                  manifest = json.loads(get(base + 'manifest.webmanifest').decode('utf-8'))
                  assert manifest['short_name'] == 'Knit Compass'
                  app = get(base + 'app.html?v=0.4.2')
                  digest = hashlib.sha256(app).hexdigest()
                  assert digest == expected, f'public direct app SHA mismatch: {digest}'

                  daily = get(root + 'daily/').decode('utf-8')
                  assert '<title>Knit Compass — 独立実用版 v0.4</title>' in daily
                  assert "kc_independent_practical_v0_4" in daily
                  assert 'DecompressionStream' not in daily
                  assert 'serviceWorker' not in daily
                  assert 'manifest.webmanifest' not in daily
                  assert './icon.svg' in daily
                  get(root + 'daily/icon.svg')
                  print(f'PASS: direct app SHA {digest}; plain /daily/ shortcut is public and service-worker free')
                  break
              except Exception as error:
                  print(f'Attempt {attempt}/20 failed: {error}')
                  if attempt == 20:
                      raise
                  time.sleep(15)
