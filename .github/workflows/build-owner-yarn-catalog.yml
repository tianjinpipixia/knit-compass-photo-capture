name: Validate / refresh owner yarn catalog

"on":
  pull_request:
    paths:
      - "scripts/build_mz100_catalog.py"
      - "scripts/validate_owner_yarn_implementation.py"
      - "scripts/validate_navigation_links.py"
      - "requirements-catalog.txt"
      - "data/yarn-catalog/**"
      - "tests/test_owner_catalog_review_branch.py"
      - ".github/workflows/build-owner-yarn-catalog.yml"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "scripts/build_mz100_catalog.py"
      - "scripts/validate_owner_yarn_implementation.py"
      - "requirements-catalog.txt"
      - "owner-yarns/index.html"
      - "brand-intelligence/index.html"
      - "market-signals.js"
      - "market-intelligence/**"
      - "data/brand-md-monitoring/**"
      - "data/market-trends/**"
      - "data/manual-intake/**"
      - "data/human-review/**"
      - "data/yarn-catalog/**"
      - ".github/workflows/build-owner-yarn-catalog.yml"
  schedule:
    - cron: "17 21 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: owner-yarn-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate committed catalog, intake, and market signals
        run: python scripts/validate_owner_yarn_implementation.py
      - name: Validate navigation
        run: python scripts/validate_navigation_links.py
      - name: Verify review-only persistence without remote writes
        run: python -m unittest discover -s tests -p test_owner_catalog_review_branch.py -v

  refresh:
    needs: validate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install catalog dependencies
        run: python -m pip install -r requirements-catalog.txt
      - name: Expand MZ100 catalog to 3,000 NOT_PROMOTED candidates
        run: python scripts/build_mz100_catalog.py --target 3000 --seed data/yarn-catalog/mz100-catalog-2000.json --output data/yarn-catalog/mz100-catalog-3000.json --delay 0.20 --max-pages 300 --retries 3
      - name: Validate refreshed catalog, intake, and market signals
        run: python scripts/validate_owner_yarn_implementation.py
      - name: Validate navigation
        run: python scripts/validate_navigation_links.py
      - name: Upload generated catalog evidence
        uses: actions/upload-artifact@v4
        with:
          name: owner-yarn-catalog-3000-candidates
          path: data/yarn-catalog/mz100-catalog-3000.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve refreshed catalog on a review branch (never push main)
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/yarn-catalog/mz100-catalog-3000.json)" ]; then
            echo "Catalog is unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="review/owner-yarn-catalog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/yarn-catalog/mz100-catalog-3000.json
          git commit -m "Propose owner yarn catalog refresh for review"
          git push origin "HEAD:refs/heads/$branch"
          echo "Catalog proposal saved to $branch; open a reviewed PR before merging into protected main." >> "$GITHUB_STEP_SUMMARY"
