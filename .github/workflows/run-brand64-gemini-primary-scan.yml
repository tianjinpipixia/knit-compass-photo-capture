name: Run Brand64 Gemini primary scan

on:
  schedule:
    # 05:30 JST every day (20:30 UTC previous day)
    - cron: "30 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/run_brand64_gemini_primary_scan.py
      - tests/test_brand64_gemini_primary_scan.py
      - config/brand64-active-brands.json
      - .github/workflows/run-brand64-gemini-primary-scan.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: brand64-gemini-primary-scan
  cancel-in-progress: false

jobs:
  gemini-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      TZ: Asia/Tokyo
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the last successful Gemini baseline
        shell: bash
        run: |
          previous_run=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/run-brand64-gemini-primary-scan.yml/runs" -f status=success -f branch=main -f per_page=1 --jq '.workflow_runs[0].id // empty')
          if [ -n "$previous_run" ]; then
            artifact_name=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${previous_run}/artifacts" --jq '[.artifacts[] | select(.expired == false) | select(.name | startswith("brand64-gemini-primary-scan-"))][0].name // empty')
            if [ -n "$artifact_name" ]; then
              gh run download "$previous_run" --name "$artifact_name" --dir data/brand-md-monitoring/gemini-primary-scans
            fi
          fi

      - name: Determine observation date
        id: obs
        shell: bash
        run: echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: Verify scanner completion and evidence handling
        run: python -m unittest discover -s tests -p test_brand64_gemini_primary_scan.py -v

      - name: Run Phase A Gemini primary scan
        id: scan
        continue-on-error: true
        shell: bash
        run: |
          python scripts/run_brand64_gemini_primary_scan.py \
            --date "${{ steps.obs.outputs.date }}" \
            --batch-size 8

      - name: Upload Gemini scan artifact
        if: always() && steps.scan.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: brand64-gemini-primary-scan-${{ steps.obs.outputs.date }}
          path: data/brand-md-monitoring/gemini-primary-scans/
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve scan results on a handoff branch
        if: always() && steps.scan.outcome != 'skipped'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- data/brand-md-monitoring/gemini-primary-scans)" ]; then
            scan_branch="brand64/gemini-${{ steps.obs.outputs.date }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git checkout -b "$scan_branch"
            git add data/brand-md-monitoring/gemini-primary-scans
            git commit -m "Brand64 Gemini primary scan ${{ steps.obs.outputs.date }}"
            git push origin "HEAD:refs/heads/$scan_branch"
            echo "Gemini results saved to $scan_branch. Phase B must validate the artifact before a normal pull request into main." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Gemini scan artifact changes to save."
          fi

      - name: Enforce scan completion state
        if: always() && steps.scan.outcome != 'success'
        shell: bash
        run: |
          echo "Gemini primary scan is missing or incomplete. Artifact/status was preserved; day must not be marked no-change." >&2
          exit 1
