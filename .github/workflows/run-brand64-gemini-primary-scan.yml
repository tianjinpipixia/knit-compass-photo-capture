name: Run Brand64 free official-site scan

on:
  schedule:
    # 05:30 JST daily. No paid AI/search API is invoked.
    - cron: "30 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/run_brand64_free_direct_scan.py
      - scripts/brand64_flash_pipeline.py
      - scripts/publish_brand64_flash_feed.py
      - scripts/brand_direct_adapters.py
      - tests/test_brand64_free_direct_scan.py
      - tests/test_brand64_flash_pipeline.py
      - config/brand64-free-direct-sources.json
      - config/brand64-active-brands.json
      - .github/workflows/run-brand64-gemini-primary-scan.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: brand64-gemini-primary-scan
  cancel-in-progress: false

jobs:
  direct-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify collection, recovery, and preservation
        run: |
          python -m unittest discover -s tests -p test_brand64_free_direct_scan.py -v
          python -m unittest discover -s tests -p test_brand64_flash_pipeline.py -v

      - name: Restore state from latest observations, including incomplete runs
        shell: bash
        run: |
          mkdir -p data/brand-md-monitoring/direct-scans
          feed_ref=$(git ls-remote --heads origin refs/heads/brand64/flash-feed)
          if [ -n "$feed_ref" ]; then
            git fetch --depth=1 origin brand64/flash-feed
            for state_file in known-products.json coverage-state.json deep-dive-queue.json flash-history.json detail-results.json; do
              git show "FETCH_HEAD:data/brand-md-monitoring/direct-scans/$state_file" > "data/brand-md-monitoring/direct-scans/$state_file"
            done
          fi
          baseline_tmp=$(mktemp -d)
          if [ ! -f data/brand-md-monitoring/direct-scans/known-products.json ]; then
          for previous_run in $(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/run-brand64-gemini-primary-scan.yml/runs" -f status=completed -f branch=main -f per_page=30 --jq '.workflow_runs[].id'); do
            artifact_name=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${previous_run}/artifacts" --jq '[.artifacts[] | select(.expired == false) | select(.name | startswith("brand64-free-direct-"))] | sort_by(.created_at, .id) | reverse | .[0].name // empty')
            if [ -n "$artifact_name" ]; then
              if gh run download "$previous_run" --name "$artifact_name" --dir "$baseline_tmp/$previous_run"; then
                if [ -f "$baseline_tmp/$previous_run/known-products.json" ]; then
                  for state_file in known-products.json coverage-state.json deep-dive-queue.json flash-history.json detail-results.json; do
                    if [ -f "$baseline_tmp/$previous_run/$state_file" ]; then
                      cp "$baseline_tmp/$previous_run/$state_file" "data/brand-md-monitoring/direct-scans/$state_file"
                    fi
                  done
                  break
                fi
              fi
            fi
          done
          fi
          # Artifacts expire. Result branches are the durable fallback.
          if [ ! -f data/brand-md-monitoring/direct-scans/known-products.json ]; then
            scan_refs=$(git ls-remote --heads origin 'refs/heads/brand64/direct-*' | awk '{print $2}' | sort -Vr | sed -n '1,10p')
            for scan_ref in $scan_refs; do
              git fetch --depth=1 origin "$scan_ref"
              if git cat-file -e FETCH_HEAD:data/brand-md-monitoring/direct-scans/known-products.json; then
                for state_file in known-products.json coverage-state.json deep-dive-queue.json flash-history.json detail-results.json; do
                  if git cat-file -e "FETCH_HEAD:data/brand-md-monitoring/direct-scans/$state_file" 2>/dev/null; then
                    git show "FETCH_HEAD:data/brand-md-monitoring/direct-scans/$state_file" > "data/brand-md-monitoring/direct-scans/$state_file"
                  fi
                done
                break
              fi
            done
            if [ -n "$scan_refs" ] && [ ! -f data/brand-md-monitoring/direct-scans/known-products.json ]; then
              echo "Previous observations exist but could not be restored. Refusing to reset first-seen history." >&2
              exit 1
            fi
          fi

      - name: Collect and checkpoint flash observations for all brands
        id: flash
        continue-on-error: true
        run: python scripts/run_brand64_free_direct_scan.py --stage flash --budget-seconds 180 --max-pages 2

      - name: Make flash available before recovery or detail research
        if: always() && steps.flash.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: brand64-free-direct-${{ github.run_id }}-${{ github.run_attempt }}-flash
          path: data/brand-md-monitoring/direct-scans/
          if-no-files-found: error
          retention-days: 30

      - name: Publish saved flash to the owner screen
        id: feed_flash
        if: always() && steps.flash.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/publish_brand64_flash_feed.py

      - name: Recover pending pages and transient failures in the same daily run
        id: retry
        if: always() && steps.flash.outcome == 'success'
        continue-on-error: true
        run: python scripts/run_brand64_free_direct_scan.py --stage retry --budget-seconds 240 --max-pages 4

      - name: Enrich selected products after flash has been saved
        id: deep
        if: always() && steps.flash.outcome == 'success'
        continue-on-error: true
        run: python scripts/run_brand64_free_direct_scan.py --stage deep --budget-seconds 90

      - name: Check every brand for unresolved coverage
        id: coverage
        if: always() && steps.flash.outcome == 'success'
        continue-on-error: true
        run: python scripts/run_brand64_free_direct_scan.py --stage check

      - name: Refresh the owner screen with recovery and detail status
        id: feed_final
        if: always() && steps.flash.outcome == 'success'
        continue-on-error: true
        run: python scripts/publish_brand64_flash_feed.py

      - name: Upload final observations and recovery state
        if: always() && steps.flash.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: brand64-free-direct-${{ github.run_id }}-${{ github.run_attempt }}-final
          path: data/brand-md-monitoring/direct-scans/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve results and show the flash report
        if: always() && steps.flash.outcome != 'skipped'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scan_branch="brand64/direct-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$scan_branch"
          git add data/brand-md-monitoring/direct-scans
          if ! git diff --cached --quiet; then
            git commit -m "Preserve flash observations, coverage gaps and selected research"
            git push origin "HEAD:refs/heads/$scan_branch"
          fi
          echo "Observation records: $scan_branch. AI API requests: 0." >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/brand-md-monitoring/direct-scans/summary.md ]; then
            cat data/brand-md-monitoring/direct-scans/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail visibly when any collection stage or coverage is incomplete
        if: always() && (steps.flash.outcome != 'success' || steps.retry.outcome != 'success' || steps.deep.outcome != 'success' || steps.coverage.outcome != 'success' || steps.feed_final.outcome != 'success')
        run: |
          echo "Daily scope is incomplete. See each brand's gaps and saved flash; product count alone cannot pass this gate." >&2
          exit 1
