name: Validate system registry

"on":
  pull_request:
    paths:
      - ".gitattributes"
      - "**/.gitattributes"
      - "README.md"
      - "app.js"
      - "knitting-ends-field.js"
      - "app-state-guard.js"
      - "app.css"
      - "connection-status.css"
      - "photo-capture-card-progress-v1.css"
      - "photo-capture-card-progress-v1.js"
      - "backup.js"
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "icon.svg"
      - "icon-180.png"
      - "icon-192.png"
      - "icon-512.png"
      - "icon-maskable-512.png"
      - "brand-intelligence/app.html"
      - "brand-intelligence/index.html"
      - "brand-intelligence/index-current.html"
      - "brand-intelligence/yarn-glossary.html"
      - "brand-intelligence/data/cn-yarn-glossary.json"
      - "brand-intelligence/sw.js"
      - "brand-intelligence/manifest.webmanifest"
      - "owner-yarns/index.html"
      - "customer-sharing/index.html"
      - "customer-sharing/policy.js"
      - "customer-sharing/**"
      - "stylem/index.html"
      - "stylem/**"
      - "daily/index.html"
      - "android-daily/**"
      - "config/system-registry.json"
      - "docs/SYSTEM_REGISTRY.md"
      - "docs/CN_YARN_GLOSSARY.md"
      - "docs/CUSTOMER_SHARING.md"
      - "docs/DATA_CONTRACT.md"
      - "docs/KPI_MEASUREMENT.md"
      - "docs/OWNER_YARN_2000_IMPLEMENTATION.md"
      - "data/kpi_log_template.csv"
      - "status/**"
      - "start.bat"
      - "start.sh"
      - "requirements-validation.txt"
      - "scripts/validate_system_registry.py"
      - "scripts/validate_yarn_glossary.py"
      - "scripts/validate_handoff_safety.py"
      - "scripts/validate_ui_state_guard.py"
      - "scripts/validate_customer_sharing.py"
      - "scripts/validate_photo_capture_install.py"
      - "scripts/validate_v04_monthly_md.py"
      - ".github/workflows/validate-system-registry.yml"
      - ".github/workflows/validate-handoff-safety.yml"
      - ".github/workflows/validate-customer-sharing.yml"
  push:
    branches:
      - main
    paths:
      - ".gitattributes"
      - "**/.gitattributes"
      - "README.md"
      - "app.js"
      - "knitting-ends-field.js"
      - "app-state-guard.js"
      - "app.css"
      - "connection-status.css"
      - "photo-capture-card-progress-v1.css"
      - "photo-capture-card-progress-v1.js"
      - "backup.js"
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "icon.svg"
      - "icon-180.png"
      - "icon-192.png"
      - "icon-512.png"
      - "icon-maskable-512.png"
      - "brand-intelligence/app.html"
      - "brand-intelligence/index.html"
      - "brand-intelligence/index-current.html"
      - "brand-intelligence/yarn-glossary.html"
      - "brand-intelligence/data/cn-yarn-glossary.json"
      - "brand-intelligence/sw.js"
      - "brand-intelligence/manifest.webmanifest"
      - "owner-yarns/index.html"
      - "customer-sharing/index.html"
      - "customer-sharing/policy.js"
      - "customer-sharing/**"
      - "stylem/index.html"
      - "stylem/**"
      - "daily/index.html"
      - "android-daily/**"
      - "config/system-registry.json"
      - "docs/SYSTEM_REGISTRY.md"
      - "docs/CN_YARN_GLOSSARY.md"
      - "docs/CUSTOMER_SHARING.md"
      - "docs/DATA_CONTRACT.md"
      - "docs/KPI_MEASUREMENT.md"
      - "docs/OWNER_YARN_2000_IMPLEMENTATION.md"
      - "data/kpi_log_template.csv"
      - "status/**"
      - "start.bat"
      - "start.sh"
      - "requirements-validation.txt"
      - "scripts/validate_system_registry.py"
      - "scripts/validate_yarn_glossary.py"
      - "scripts/validate_handoff_safety.py"
      - "scripts/validate_ui_state_guard.py"
      - "scripts/validate_customer_sharing.py"
      - "scripts/validate_photo_capture_install.py"
      - "scripts/validate_v04_monthly_md.py"
      - ".github/workflows/validate-system-registry.yml"
      - ".github/workflows/validate-handoff-safety.yml"
      - ".github/workflows/validate-customer-sharing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Validate registry, source revisions, and KPI schema
        run: python scripts/validate_system_registry.py
      - name: Validate China yarn glossary contract
        run: python scripts/validate_yarn_glossary.py
      - name: Validate Photo Capture install surface
        run: python scripts/validate_photo_capture_install.py
      - name: Validate V04 monthly observation and MD contract
        run: python scripts/validate_v04_monthly_md.py
