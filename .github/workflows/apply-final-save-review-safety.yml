name: Apply final save and review safety fixes

"on":
  push:
    branches:
      - fix/final-save-review-safety-20260804
    paths:
      - "scripts/apply_final_save_review_safety.py"
      - ".github/workflows/apply-final-save-review-safety.yml"
  workflow_dispatch:

concurrency:
  group: final-save-review-safety
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-save-review-safety-20260804
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Apply targeted fixes
        run: python scripts/apply_final_save_review_safety.py
      - name: Validate Human Review safety
        run: python scripts/validate_handoff_safety.py
      - name: Validate Photo Capture UI state guard
        run: python scripts/validate_ui_state_guard.py
      - name: Validate system registry
        run: python scripts/validate_system_registry.py
      - name: Commit generated fixes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html brand-intelligence/index.html brand-intelligence/sw.js config/system-registry.json README.md docs/PHOTO_CAPTURE_HANDOFF.md docs/SYSTEM_REGISTRY.md scripts/validate_handoff_safety.py .github/workflows/validate-system-registry.yml
          git commit -m "Fix remaining save and Human Review safety gaps"
          git push origin HEAD:fix/final-save-review-safety-20260804
