<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="refresh" content="0; url=../">
  <link rel="canonical" href="../">
  <title>Photo Capture | Knit Compass</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#17231d;background:#f2f6f3}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 90% -10%,rgba(20,107,77,.14),transparent 32rem),#f2f6f3}
    main{width:min(100%,560px);border:1px solid #d8dfda;border-radius:18px;background:#fff;padding:28px;box-shadow:0 18px 50px rgba(24,45,34,.09)}
    h1{margin:0 0 12px;font-size:26px}p{margin:0 0 18px;color:#66736c;line-height:1.7}a{display:inline-flex;min-height:48px;align-items:center;justify-content:center;border-radius:12px;background:#146b4d;padding:11px 16px;color:#fff;font-weight:800;text-decoration:none}
  </style>
</head>
<body data-compat-route="photo-capture-current">
  <main>
    <h1>Photo Captureを最新版へ切り替えています</h1>
    <p>このURLは旧Photo Captureとの互換入口です。現在のPhoto Captureへ移動します。</p>
    <a href="../">Photo Captureを開く</a>
  </main>
  <script>
    (() => {
      const target = new URL('../', location.href);
      const legacyScopePath = new URL('./', location.href).pathname;
      const redirect = () => location.replace(target.href);
      if (!('serviceWorker' in navigator)) return redirect();
      navigator.serviceWorker.getRegistrations()
        .then((registrations) => Promise.all(registrations
          .filter((registration) => new URL(registration.scope).pathname === legacyScopePath)
          .map((registration) => registration.unregister())))
        .finally(redirect);
    })();
  </script>
</body>
</html>
